<title>auditLab Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Fieldguide식 작업 화면. 어두운 슬레이트 상단 바, 연회색 바탕 위 흰 패널 3개(목록·노트·질문). 강조색은 파랑 하나, 상태색은 의미에만 */
:root{
  --canvas:#f4f5f7; --panel:#ffffff; --hover:#f1f3f5; --sel:#e9ecf0; --line:#e3e6ea; --line2:#eef0f3;
  --fg:#1f2329; --fg2:#4a515b; --mu:#8a929c;
  --bar:#2e3744; --barfg:#e9edf2; --barmu:#9aa6b4;
  --acc:#2f6fdf; --accw:#eaf1fd; --onacc:#ffffff;
  --ok:#3f9a4a; --okw:#ecf6ed; --warn:#e3a33b; --warnfg:#b77714; --warnw:#fdf5e7; --gray:#9aa1aa; --grayw:#f2f3f5;
  --f:"Inter","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#14171c; --panel:#1b1f25; --hover:#232830; --sel:#2a3039; --line:#2c323b; --line2:#252a32;
  --fg:#e8ebef; --fg2:#bcc3cc; --mu:#858e99;
  --bar:#0f1216; --barfg:#e8ebef; --barmu:#7e8996;
  --acc:#5b93f0; --accw:#1b2a42; --onacc:#ffffff;
  --ok:#5cb867; --okw:#18291b; --warn:#e8ae4d; --warnfg:#e8ae4d; --warnw:#2f2614; --gray:#7d8590; --grayw:#22272e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#14171c; --panel:#1b1f25; --hover:#232830; --sel:#2a3039; --line:#2c323b; --line2:#252a32;
  --fg:#e8ebef; --fg2:#bcc3cc; --mu:#858e99;
  --bar:#0f1216; --barfg:#e8ebef; --barmu:#7e8996;
  --acc:#5b93f0; --accw:#1b2a42; --onacc:#ffffff;
  --ok:#5cb867; --okw:#18291b; --warn:#e8ae4d; --warnfg:#e8ae4d; --warnw:#2f2614; --gray:#7d8590; --grayw:#22272e;
  color-scheme:dark}

html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--fg);font-family:var(--f);font-size:14px;letter-spacing:-0.005em;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-radius:6px}

.app{height:100%;display:grid;grid-template-columns:280px minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:0 12px 12px;padding-top:env(safe-area-inset-top,0px)}
.top{grid-column:1/-1;margin:0 -12px;background:var(--bar);color:var(--barfg);height:48px;display:flex;align-items:center;gap:20px;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;white-space:nowrap}
.mark{width:22px;height:22px;border-radius:6px;background:var(--ok);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}
.top .sum{display:flex;gap:16px;font-size:12px;color:var(--barmu);margin-left:auto;white-space:nowrap}
.top .sum span{display:inline-flex;align-items:center;gap:6px}
.tabs{display:none}

/* panels */
.side,.main,.chat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:0}

/* sidebar */
.side{display:flex;flex-direction:column;padding:14px 10px 0}
.side-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 6px 12px}
.side-h b{font-size:15px;font-weight:600}
.side-h span{font-size:12px;color:var(--mu)}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 10px;height:36px}
.search:focus-within{border-color:var(--acc)}
.search svg{flex:none;color:var(--mu)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;font-size:13px}
.search kbd{font-family:var(--mono);font-size:10px;color:var(--mu);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.filters{display:flex;gap:4px;flex-wrap:wrap;padding:10px 0 6px}
.fchip{font-size:12px;font-weight:500;height:26px;padding:0 9px;border-radius:6px;border:1px solid var(--line);color:var(--fg2);background:var(--panel)}
.fchip:hover{background:var(--hover)}
.fchip[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--accw)}
.tree{flex:1;overflow-y:auto;padding:2px 0 12px;min-height:0}
.grp{font-size:11px;font-weight:600;color:var(--mu);padding:14px 8px 4px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.02em}
.it{width:100%;text-align:left;padding:6px 8px;border-radius:6px;font-size:13px;color:var(--fg2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.it:hover{background:var(--hover)}
.it[aria-current="true"]{background:var(--sel);color:var(--fg);font-weight:600}
.it .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.d-verified{background:var(--ok)} .d-check{background:var(--warn)} .d-kb{background:transparent;box-shadow:inset 0 0 0 1.5px var(--gray)} .d-virtual{background:var(--acc)}
.cnt{font-size:11px;font-weight:600;color:var(--mu);font-variant-numeric:tabular-nums}
.empty{padding:16px 8px;color:var(--mu);font-size:13px}
.sfoot{border-top:1px solid var(--line);padding:10px 2px calc(12px + env(safe-area-inset-bottom,0px))}
.gapbtn{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--warn);background:var(--warnw);color:var(--warnfg);font-weight:600;border-radius:6px;padding:7px 10px;font-size:12px;width:100%}

/* note */
.main{overflow-y:auto}
.note{max-width:820px;padding:28px 40px 56px;margin:0 auto}
.crumb{font-size:12px;color:var(--mu)}
.note h1{font-size:26px;font-weight:600;letter-spacing:-0.02em;margin:8px 0 0;line-height:1.3;text-wrap:balance}
.meta{display:flex;gap:6px;align-items:center;margin-top:12px;font-size:12px;color:var(--mu);flex-wrap:wrap}
.g{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid}
.g-law,.g-reg{color:var(--acc);border-color:var(--acc);background:var(--accw)}
.g-std{color:var(--ok);border-color:var(--ok);background:var(--okw)}
.g-sup,.g-prac{color:var(--mu);border-color:var(--gray);background:var(--grayw)}
.g-chk{color:var(--warnfg);border-color:var(--warn);background:var(--warnw)}
.alias{font-size:12px;color:var(--fg2);background:var(--grayw);padding:2px 8px;border-radius:4px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;margin-left:4px}
.body{margin-top:22px;display:flex;flex-direction:column;gap:12px;line-height:1.75;font-size:14.5px;color:var(--fg2)}
.body h2{font-size:13px;font-weight:600;color:var(--fg);margin:16px 0 0}
.body p{margin:0}
.body ul,.body ol{margin:0;padding-left:20px;display:grid;gap:4px}
.l{color:var(--acc);font-weight:500;cursor:pointer;text-decoration:none}
.l:hover{text-decoration:underline}
.l.miss{color:var(--warnfg);cursor:default}
.facts{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fhead{display:grid;grid-template-columns:minmax(0,1fr) 220px 92px;gap:16px;padding:9px 14px;background:var(--canvas);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--fg2)}
.fact{display:grid;grid-template-columns:minmax(0,1fr) 220px 92px;gap:16px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2);line-height:1.6;color:var(--fg)}
.fact:last-child{border-bottom:0}
.fact:hover{background:var(--hover)}
.fsrc{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.checks li{color:var(--warnfg)}
.srcs{display:flex;flex-direction:column;gap:4px;font-size:13px}
.srcs a{text-decoration:none}
.srcs a:hover{text-decoration:underline}
.foot{margin-top:36px;border-top:1px solid var(--line);padding-top:18px;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:24px}
.foot h3{font-size:12px;color:var(--mu);font-weight:600;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);color:var(--fg2);background:var(--panel)}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.graph{width:100%;height:150px;border:1px solid var(--line);border-radius:var(--r);background:var(--canvas);display:block}
.graph text{font-size:9px;fill:var(--mu);font-family:var(--f);cursor:pointer}
.graph line{stroke:var(--line);stroke-width:1}
.graph .n{fill:var(--gray);cursor:pointer}
.graph .c{fill:var(--acc)}
.oi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:baseline}
.gaprow{padding:12px 0;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:4px}
.gaprow b{color:var(--fg);font-weight:600}
.gaprow span{font-size:12px;color:var(--mu)}

/* chat */
.chat{display:flex;flex-direction:column}
.chat-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-h b{font-size:15px;font-weight:600}
.chat-h span{font-size:11px;color:var(--mu)}
.msgs{flex:1;padding:16px 18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0}
.me{align-self:flex-end;background:var(--acc);color:var(--onacc);padding:9px 13px;border-radius:10px 10px 2px 10px;max-width:85%;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{align-self:flex-start;background:var(--canvas);border:1px solid var(--line);padding:11px 13px;border-radius:10px 10px 10px 2px;max-width:94%;line-height:1.7;color:var(--fg);overflow-wrap:anywhere}
.bot p{margin:0 0 6px} .bot p:last-child{margin:0}
.bot ul{margin:4px 0;padding-left:18px}
.bot.missbox{border-color:var(--warn);background:var(--warnw)}
.bot .tag{display:block;color:var(--warnfg);font-size:12px;font-weight:600;margin-bottom:4px}
.bot.err{background:var(--warnw);border-color:var(--warn);color:var(--warnfg)}
.thinking{color:var(--mu)}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg p{font-size:12px;color:var(--mu);margin:0 0 2px}
.sugg button{text-align:left;font-size:13px;padding:9px 12px;border-radius:6px;border:1px solid var(--line);color:var(--fg2);background:var(--panel)}
.sugg button:hover{border-color:var(--acc);color:var(--acc)}
.hint{font-size:11px;color:var(--mu);margin:0 18px 8px}
.ask{margin:0 14px 14px;border:1px solid var(--line);border-radius:8px;padding:8px 8px 8px 12px;display:flex;align-items:flex-end;gap:8px;background:var(--panel)}
.ask:focus-within{border-color:var(--acc)}
.ask textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font:inherit;color:var(--fg);line-height:1.5;max-height:120px;padding:4px 0;min-width:0}
.send{background:var(--acc);color:var(--onacc);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;flex:none}
.send[disabled]{opacity:.4;cursor:default}

@media (max-width:1180px){.app{grid-template-columns:240px minmax(0,1fr) 320px}.note{padding:24px 24px 48px}.fhead,.fact{grid-template-columns:minmax(0,1fr) 160px 84px}}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr);gap:0;padding:0;padding-top:env(safe-area-inset-top,0px)}
  .top{margin:0}
  .top .sum{display:none}
  .tabs{display:flex;gap:4px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
  .tabs button{flex:1;height:34px;border-radius:6px;font-weight:600;font-size:13px;color:var(--mu)}
  .tabs button[aria-pressed="true"]{background:var(--sel);color:var(--fg)}
  .side,.main,.chat{grid-row:3;grid-column:1;border:0;border-radius:0}
  .app[data-pane="list"] .main,.app[data-pane="list"] .chat{display:none}
  .app[data-pane="note"] .side,.app[data-pane="note"] .chat{display:none}
  .app[data-pane="chat"] .side,.app[data-pane="chat"] .main{display:none}
  .side{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .note{padding:20px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
  .note h1{font-size:22px}
  .fhead{display:none}
  .fact{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .fact > span:first-child{grid-column:1/-1}
  .foot{grid-template-columns:1fr}
}
</style>

<div class="app" id="app" data-pane="note">
  <header class="top">
    <div class="brand"><span class="mark">a</span>auditLab Wiki</div>
    <div class="sum"><span><i class="dot d-verified"></i><b id="s-v"></b> 원문 대조</span><span><i class="dot d-kb"></i><b id="s-k"></b> v3.0 이관</span><span><i class="dot d-check"></i><b id="s-c"></b> 확인 필요</span></div>
  </header>
  <nav class="tabs" aria-label="화면">
    <button data-pane="list" aria-pressed="false">목록</button>
    <button data-pane="note" aria-pressed="true">노트</button>
    <button data-pane="chat" aria-pressed="false">질문</button>
  </nav>

  <aside class="side" aria-label="노트 목록">
    <div class="side-h"><b>노트</b><span id="count"></span></div>
    <label class="search" for="q">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="노트·조문·내용 검색" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="filters" id="filters" role="group" aria-label="근거 등급 필터"></div>
    <div class="tree" id="tree"></div>
    <div class="sfoot">
      <button class="gapbtn" id="gapbtn"><span>위키에 없는 질문</span><span id="gapcnt">0건</span></button>
    </div>
  </aside>

  <main class="main" id="main"><article class="note" id="note"></article></main>

  <section class="chat" aria-label="위키에게 묻기">
    <div class="chat-h"><b>위키에게 묻기</b><span>위키 노트만 근거로 답해요</span></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="hint">답에 달린 링크를 누르면 노트가 열려요 · 위키에 없으면 빈칸 목록에 쌓여요</div>
    <form class="ask" id="ask">
      <textarea id="input" rows="1" placeholder="궁금한 걸 물어보세요"></textarea>
      <button class="send" id="send" type="submit">보내기</button>
    </form>
  </section>
</div>

<script>
const W=/*__WIKI_DATA__*/null;
(function(){
const byId={}; W.notes.forEach(n=>byId[n.id]=n);
const gapsNote=W.notes.find(n=>n.title==="위키에 없는 질문");
const openNote=W.notes.find(n=>n.title==="확인 필요 목록");
const real=W.notes.filter(n=>n.status!=="virtual");
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STATUS={verified:"원문 대조",kb:"v3.0 이관 · 원문 대조 전",check:"확인할 것 있음",virtual:"자동 모음"};
document.getElementById("count").textContent=`노트 ${real.length}개`;
["verified","kb","check"].forEach((s,i)=>document.getElementById(["s-v","s-k","s-c"][i]).textContent=real.filter(n=>n.status===s).length);

let current=null, filter="전체", query="", gaps=[];

/* inline markdown: escape → [[link]] → **bold** */
function inline(s){
  return esc(s).replace(/\[\[([^\]]+)\]\]/g,(m,t)=>{const id=W.names[t];return id?`<a class="l" data-go="${id}">${esc(t)}</a>`:`<span class="l miss" title="위키에 없는 노트">${esc(t)}</span>`})
               .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
}
function block(text){
  const out=[];let list=null;
  text.split("\n").forEach(line=>{
    const ul=line.match(/^- (.*)/), ol=line.match(/^\d+\. (.*)/);
    if(ul||ol){const tag=ul?"ul":"ol";if(!list||list.tag!==tag){list={tag,items:[]};out.push(list)}list.items.push((ul||ol)[1]);return}
    list=null; if(line.trim())out.push(`<p>${inline(line)}</p>`);
  });
  return out.map(b=>typeof b==="string"?b:`<${b.tag}>${b.items.map(i=>`<li>${inline(i)}</li>`).join("")}</${b.tag}>`).join("");
}
const GSLUG={"법률":"law","시행령·규정":"reg","기준":"std","감독기관":"sup","관행":"prac","확인 필요":"chk"};
const badge=g=>`<span class="g g-${GSLUG[g]||"prac"}">${esc(g)}</span>`;

/* sidebar */
const FIL=["전체","법률","시행령·규정","기준","관행","확인 필요"];
function renderFilters(){
  document.getElementById("filters").innerHTML=FIL.map(f=>{
    const n=f==="확인 필요"?real.filter(x=>x.status==="check").length:"";
    return `<button class="fchip" data-f="${f}" aria-pressed="${filter===f}">${f}${n?" "+n:""}</button>`}).join("");
}
function match(n){
  if(filter==="확인 필요"&&n.status!=="check")return false;
  if(filter!=="전체"&&filter!=="확인 필요"&&!n.grades.includes(filter))return false;
  if(!query)return true;
  const q=query.toLowerCase();
  return [n.title,...n.aliases,n.intro,...n.facts.map(f=>f.text+" "+f.src)].join(" ").toLowerCase().includes(q);
}
function renderTree(){
  const tree=document.getElementById("tree");let html="";
  const searching=query||filter!=="전체";
  W.folders.forEach(fd=>{
    const items=W.notes.filter(n=>n.type===fd&&(n.status==="virtual"?!searching:match(n)));
    if(!items.length)return;
    html+=`<div class="grp">${fd}<span>${items.filter(n=>n.status!=="virtual").length||""}</span></div>`;
    html+=items.map(n=>{
      const extra=n===gapsNote?`<span class="cnt">${gaps.length||""}</span>`:n===openNote?`<span class="cnt">${W.openItems.length}</span>`:`<i class="dot d-${n.status}"></i>`;
      return `<button class="it" data-go="${n.id}" aria-current="${current===n.id}"><span class="t">${esc(n.title)}</span>${extra}</button>`}).join("");
  });
  tree.innerHTML=html||`<div class="empty">찾는 노트가 없어요. 오른쪽에 질문하면 빈칸 목록에 남길 수 있어요.</div>`;
}

/* note view */
function graph(n){
  const ids=[...new Set([...n.links,...n.backlinks])].filter(i=>byId[i]&&i!==n.id).slice(0,10);
  if(!ids.length)return `<svg class="graph" viewBox="0 0 240 150" role="img" aria-label="연결 없음"><circle class="c" cx="120" cy="75" r="7"/></svg>`;
  const cx=120,cy=75,R=52;
  let lines="",nodes="",labels="";
  ids.forEach((id,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/ids.length, x=cx+R*1.15*Math.cos(a), y=cy+R*Math.sin(a);
    lines+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    nodes+=`<circle class="n" data-go="${id}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"><title>${esc(byId[id].title)}</title></circle>`;
    const t=byId[id].title, lab=t.length>7?t.slice(0,6)+"…":t, anchor=Math.cos(a)>0.3?"start":Math.cos(a)<-0.3?"end":"middle";
    const lx=x+(anchor==="start"?6:anchor==="end"?-6:0), ly=y+(Math.sin(a)>0.3?13:Math.sin(a)<-0.3?-7:3);
    labels+=`<text data-go="${id}" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}">${esc(lab)}</text>`;
  });
  return `<svg class="graph" viewBox="0 0 240 150" role="img" aria-label="연결된 노트">${lines}${nodes}<circle class="c" cx="${cx}" cy="${cy}" r="7"/>${labels}</svg>`;
}
function renderNote(){
  const n=byId[current]; const el=document.getElementById("note"); if(!n)return;
  let h=`<div class="crumb">${esc(n.type)} / ${esc(n.title)}</div><h1>${esc(n.title)}</h1><div class="meta">`;
  h+=n.grades?.map(badge).join("")||"";
  h+=n.aliases.filter(a=>a!==n.title).map(a=>`<span class="alias">${esc(a)}</span>`).join("");
  h+=`<span class="st"><i class="dot d-${n.status}"></i>${STATUS[n.status]}${n.verified?" "+n.verified:""}</span></div><div class="body">`;
  if(n===openNote){
    h+=`<p>노트들의 '확인 필요' 항목과 확인 필요 등급 사실을 모았어요. 원문이나 현직자로 확인하면 해당 노트를 고치고 위키를 다시 빌드해요.</p><div>`+
       W.openItems.map(o=>`<div class="oi"><a class="l" data-go="${o.note}">${esc(byId[o.note].title)}</a><span>${inline(o.text)}</span></div>`).join("")+`</div>`;
  }else if(n===gapsNote){
    h+=`<p>채팅에서 "위키에 없음"으로 답한 질문이 여기에 쌓여요. Claude Code에게 "빈칸 목록 채워줘"라고 하면 원문을 찾아 노트를 만들고 위키를 다시 게시해요.</p>`;
    h+=gaps.length?gaps.map(g=>`<div class="gaprow"><b>${esc(g.question)}</b>${g.gap?`<span>${esc(g.gap)}</span>`:""}<span>${new Date(g.at).toLocaleString("ko-KR")}</span></div>`).join("")
       :`<p class="thinking">${dbState==="off"?"이 화면에서는 빈칸 목록을 불러올 수 없어요. claude.ai나 로컬 서버(serve.py)에서 열면 보여요.":"아직 쌓인 질문이 없어요."}</p>`;
  }else{
    if(n.intro)h+=block(n.intro);
    if(n.facts.length){
      h+=`<h2>사실</h2><div class="facts"><div class="fhead"><span>내용</span><span>근거</span><span>등급</span></div>`+n.facts.map(f=>`<div class="fact"><span>${inline(f.text)}</span><span class="fsrc">${esc(f.src)}</span><span>${badge(f.grade)}</span></div>`).join("")+`</div>`;
    }
    n.sections.forEach(s=>{h+=`<h2>${esc(s.name)}</h2>${block(s.text)}`});
    if(n.checks.length)h+=`<h2>확인 필요</h2><ul class="checks">${n.checks.map(c=>`<li>${inline(c)}</li>`).join("")}</ul>`;
    if(n.sources.length)h+=`<h2>출처</h2><div class="srcs">${n.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join("")}</div>`;
  }
  h+=`</div>`;
  if(n.status!=="virtual"){
    h+=`<div class="foot"><div><h3>이 노트를 가리키는 노트 · ${n.backlinks.length}</h3><div class="chips">${n.backlinks.map(b=>`<button class="chip" data-go="${b}">${esc(byId[b].title)}</button>`).join("")||`<span class="thinking" style="font-size:13px">아직 없어요</span>`}</div></div><div><h3>연결</h3>${graph(n)}</div></div>`;
  }
  el.innerHTML=h;
  document.getElementById("main").scrollTop=0;
}
function go(id,push=true){
  if(!byId[id])return; current=id; renderNote(); renderTree();
  store.set("wiki-last",id);
  if(push){try{history.replaceState(null,"","#"+id)}catch(e){}}
  setPane("note");
}

/* panes (narrow) */
const app=document.getElementById("app");
function setPane(p){app.dataset.pane=p;document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.pane===p))}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setPane(b.dataset.pane));

/* events */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){e.preventDefault();go(g.dataset.go);return}
  const f=e.target.closest(".fchip"); if(f){filter=f.dataset.f;renderFilters();renderTree();return}
});
document.getElementById("gapbtn").onclick=()=>go(gapsNote.id);
const qEl=document.getElementById("q");
qEl.addEventListener("input",()=>{query=qEl.value.trim();renderTree()});
qEl.addEventListener("keydown",e=>{if(e.key==="Enter"){const first=document.querySelector(".tree .it");if(first)go(first.dataset.go)}});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();setPane("list");qEl.focus()}});

/* 로컬 실행(serve.py): claude.ai 기능 대신 로컬 API를 쓴다 */
const LOCAL=!window.claude&&/^https?:$/.test(location.protocol)?fetch("/api/health").then(r=>r.ok?r.json():null).catch(()=>null):Promise.resolve(null);
const localSample=async(conv)=>{
  const prompt=conv.map(t=>(t.role==="user"?"[사용자]\n":"[도우미]\n")+t.content).join("\n\n")+"\n\n위 대화에서 마지막 [사용자] 질문에 [도우미]로서 답해. 답만 출력해.";
  const r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw {code:j.code||"upstream_error",message:j.message||""};
  return {text:j.text||""};
};
const localDb={collection:()=>({
  where:()=>({onSnapshot:(next,err)=>{
    const load=()=>fetch("/api/gaps").then(r=>r.json()).then(list=>next({docs:list.map((g,i)=>({id:String(i),data:()=>g}))})).catch(()=>err&&err());
    load(); localDb._reload=load; return ()=>{};
  }}),
  add:async d=>{const r=await fetch("/api/gaps",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});if(!r.ok)throw new Error("save");localDb._reload&&localDb._reload();return {}}
})};

/* gaps (db) */
let db=null, dbState="loading";
const gapcnt=document.getElementById("gapcnt");
function renderGapCount(){gapcnt.textContent=dbState==="off"?"—":`${gaps.length}건`}
(async()=>{
  const local=await LOCAL;
  if(local)db=localDb;
  else{try{db=await window.claude?.use?.("db")}catch(e){db=null}}
  if(!db){dbState="off";renderGapCount();if(current===gapsNote.id)renderNote();return}
  dbState="on";
  db.collection("gaps").where("status","==","open").onSnapshot(s=>{
    gaps=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);
    renderGapCount();renderTree();if(current===gapsNote.id)renderNote();
  },()=>{dbState="off";renderGapCount()});
})();
async function addGap(question,gap){
  if(!db)return false;
  try{await db.collection("gaps").add({question,gap:gap||"",at:Date.now(),status:"open"});return true}catch(e){return false}
}

/* chat */
const msgs=document.getElementById("msgs"), input=document.getElementById("input"), send=document.getElementById("send");
let sample=null, turns=[], busy=false;
const CONTEXT=(()=>{
  return real.map(n=>{
    let s=`### ${n.title}`+(n.aliases.length?` (다른 이름: ${n.aliases.join(", ")})`:"")+`\n`;
    if(n.intro)s+=n.intro+"\n";
    n.facts.forEach(f=>{s+=`- ${f.text} [${f.src} · ${f.grade}]\n`});
    n.sections.forEach(x=>{s+=x.text+"\n"});
    n.checks.forEach(c=>{s+=`- (확인 필요) ${c}\n`});
    return s}).join("\n");
})();
const RULES=`너는 회계감사 공부를 돕는 위키 도우미야. 아래 <wiki>에 있는 내용만 근거로 한국어로 답해.
규칙:
- 위키에 있는 사실만 말하고, 근거가 된 노트 제목을 [[노트 제목]] 형식으로 문장 안에 달아. 노트 제목은 위키에 있는 것만 써.
- 법 조문, 기준서 번호, 숫자는 위키에 적힌 그대로만 써. 위키에 없는 조문이나 수치를 만들지 마.
- 등급이 '관행'이나 '확인 필요'인 내용은 그렇다고 밝혀.
- 3~6문장으로 짧게, 해요체로 답해. 목록이 필요하면 "- "로 시작하는 줄을 써.
- 질문의 핵심에 답할 근거가 위키에 없으면, 아는 범위만 말하고 마지막 줄에 정확히 "GAP: (위키에 없는 내용 한 줄 요약)"을 써. 근거가 충분하면 GAP 줄을 쓰지 마.
- 일반 상식으로 위키의 빈자리를 채우지 마.

<wiki>
${CONTEXT}
</wiki>`;
function botHTML(text){return block(text.replace(/\n{2,}/g,"\n"))}
function add(cls,html){const d=document.createElement("div");d.className=cls;d.innerHTML=html;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
function intro(){
  msgs.innerHTML="";
  const s=add("sugg",`<p>이런 걸 물어볼 수 있어요</p>`);
  ["감사반은 어떤 회사를 감사할 수 없어?","조서를 SaaS에 저장해도 법적으로 괜찮아?","정기총회 날짜에서 감사 기한은 어떻게 계산해?","회계처리기준과 회계감사기준은 뭐가 달라?"].forEach(q=>{
    const b=document.createElement("button");b.type="button";b.textContent=q;b.onclick=()=>{input.value=q;ask()};s.appendChild(b)});
}
const ERR={not_granted:"이 페이지에서 Claude 사용이 허용되지 않았어요.",sampling_disabled:"이 계정에서는 Claude를 쓸 수 없어요.",rate_limited:"요청이 많아요. 잠시 뒤 다시 보내 주세요.",session_expired:"claude.ai에 다시 로그인해 주세요.",refused:"이 질문에는 답할 수 없어요. 다르게 물어봐 주세요.",prompt_too_large:"대화가 길어졌어요. 새로고침 후 다시 물어봐 주세요."};
async function ask(){
  const q=input.value.trim(); if(!q||busy)return;
  if(!sample){add("bot err","이 화면에서는 질문 기능을 쓸 수 없어요. claude.ai에서 열어 주세요.");return}
  if(msgs.querySelector(".sugg"))msgs.innerHTML="";
  busy=true; send.disabled=true; input.value=""; input.style.height="";
  add("me",esc(q));
  const box=add("bot",`<span class="thinking">위키를 찾아보는 중…</span>`);
  const hist=turns.slice(-6);
  const first=hist.length?hist[0]:null;
  const conv=[...hist,{role:"user",content:q}];
  conv[0]={role:"user",content:RULES+"\n\n질문: "+(first?first.content:q)};
  try{
    const {text}=await sample(conv,{cache:false,onText:({text})=>{box.innerHTML=botHTML(text.replace(/\n?GAP:.*$/s,""))}});
    const m=text.match(/\n?GAP:\s*(.+)\s*$/);
    const answer=text.replace(/\n?GAP:.*$/s,"").trim();
    if(m){
      box.className="bot missbox";
      const saved=await addGap(q,m[1].trim());
      box.innerHTML=`<span class="tag">위키에 없음${saved?" · 빈칸 목록에 추가했어요":""}</span>`+botHTML(answer||m[1]);
    }else box.innerHTML=botHTML(answer);
    turns.push({role:"user",content:q},{role:"assistant",content:text});
  }catch(e){
    if(e&&e.code==="cancelled"){box.remove()}
    else{box.className="bot err";box.textContent=ERR[e?.code]||"답을 받지 못했어요. 다시 보내 주세요.";if(e?.code==="not_granted"||e?.code==="sampling_disabled")sample=null}
  }
  busy=false; send.disabled=false; msgs.scrollTop=msgs.scrollHeight;
}
document.getElementById("ask").addEventListener("submit",e=>{e.preventDefault();ask()});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask()}});
input.addEventListener("input",()=>{input.style.height="";input.style.height=Math.min(input.scrollHeight,120)+"px"});
intro();
(async()=>{
  const local=await LOCAL;
  if(local&&local.claude)sample=localSample;
  else if(!local){try{sample=await window.claude?.use?.("sample")}catch(e){sample=null}}
  if(!sample){document.querySelector(".chat .hint").textContent=local?"claude CLI가 없어 질문 기능이 꺼져 있어요.":"질문 기능은 claude.ai나 로컬 서버(serve.py)에서 열었을 때 동작해요."}
})();

/* start */
renderFilters();
const start=(location.hash&&byId[location.hash.slice(1)])?location.hash.slice(1):(store.get("wiki-last",null)&&byId[store.get("wiki-last",null)]?store.get("wiki-last",null):W.notes.find(n=>n.title==="시작하기").id);
go(start,false); setPane("note");
})();
</script>
