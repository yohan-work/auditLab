<title>auditLab Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 작업 화면. 어두운 슬레이트 상단 바, 연회색 바탕 위 흰 패널 3개(목록·노트·질문). 강조색은 파랑 하나, 상태색은 의미에만 */
:root{
  --canvas:#f4f5f7; --panel:#ffffff; --hover:#f1f3f5; --sel:#e9ecf0; --line:#e3e6ea; --line2:#eef0f3;
  --fg:#1f2329; --fg2:#4a515b; --mu:#8a929c;
  --bar:#2e3744; --barfg:#e9edf2; --barmu:#9aa6b4;
  --acc:#2f6fdf; --accw:#eaf1fd; --onacc:#ffffff;
  --ok:#3f9a4a; --okw:#ecf6ed; --warn:#e3a33b; --warnfg:#b77714; --warnw:#fdf5e7; --gray:#9aa1aa; --grayw:#f2f3f5;
  --f:"Inter","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#14171c; --panel:#1b1f25; --hover:#232830; --sel:#2a3039; --line:#2c323b; --line2:#252a32;
  --fg:#e8ebef; --fg2:#bcc3cc; --mu:#858e99;
  --bar:#0f1216; --barfg:#e8ebef; --barmu:#7e8996;
  --acc:#5b93f0; --accw:#1b2a42; --onacc:#ffffff;
  --ok:#5cb867; --okw:#18291b; --warn:#e8ae4d; --warnfg:#e8ae4d; --warnw:#2f2614; --gray:#7d8590; --grayw:#22272e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#14171c; --panel:#1b1f25; --hover:#232830; --sel:#2a3039; --line:#2c323b; --line2:#252a32;
  --fg:#e8ebef; --fg2:#bcc3cc; --mu:#858e99;
  --bar:#0f1216; --barfg:#e8ebef; --barmu:#7e8996;
  --acc:#5b93f0; --accw:#1b2a42; --onacc:#ffffff;
  --ok:#5cb867; --okw:#18291b; --warn:#e8ae4d; --warnfg:#e8ae4d; --warnw:#2f2614; --gray:#7d8590; --grayw:#22272e;
  color-scheme:dark}

html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--fg);font-family:var(--f);font-size:14px;letter-spacing:-0.005em;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-radius:6px}

.app{height:100%;display:grid;grid-template-columns:280px minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:0 12px 12px;padding-top:env(safe-area-inset-top,0px)}
.top{grid-column:1/-1;margin:0 -12px;background:var(--bar);color:var(--barfg);height:48px;display:flex;align-items:center;gap:20px;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;white-space:nowrap}
.mark{width:22px;height:22px;border-radius:6px;background:var(--ok);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}
.top .sum{display:flex;gap:16px;font-size:12px;color:var(--barmu);margin-left:auto;white-space:nowrap}
.top .sum span{display:inline-flex;align-items:center;gap:6px}
.tabs{display:none}

/* panels */
.side,.main,.chat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:0}

/* sidebar */
.side{display:flex;flex-direction:column;padding:14px 10px 0}
.side-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 6px 12px}
.side-h b{font-size:15px;font-weight:600}
.side-h span{font-size:12px;color:var(--mu)}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 10px;height:36px}
.search:focus-within{border-color:var(--acc)}
.search svg{flex:none;color:var(--mu)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;font-size:13px}
.search kbd{font-family:var(--mono);font-size:10px;color:var(--mu);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.filters{display:flex;gap:4px;flex-wrap:wrap;padding:10px 0 6px}
.fchip{font-size:12px;font-weight:500;height:26px;padding:0 9px;border-radius:6px;border:1px solid var(--line);color:var(--fg2);background:var(--panel)}
.fchip:hover{background:var(--hover)}
.fchip[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--accw)}
.tree{flex:1;overflow-y:auto;padding:2px 0 12px;min-height:0}
.grp{font-size:11px;font-weight:600;color:var(--mu);padding:14px 8px 4px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.02em}
.it{width:100%;text-align:left;padding:6px 8px;border-radius:6px;font-size:13px;color:var(--fg2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.it:hover{background:var(--hover)}
.it[aria-current="true"]{background:var(--sel);color:var(--fg);font-weight:600}
.it .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.d-verified{background:var(--ok)} .d-check{background:var(--warn)} .d-kb{background:transparent;box-shadow:inset 0 0 0 1.5px var(--gray)} .d-virtual{background:var(--acc)}
.cnt{font-size:11px;font-weight:600;color:var(--mu);font-variant-numeric:tabular-nums}
.empty{padding:16px 8px;color:var(--mu);font-size:13px}
.sfoot{border-top:1px solid var(--line);padding:10px 2px calc(12px + env(safe-area-inset-bottom,0px))}
.gapbtn{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--warn);background:var(--warnw);color:var(--warnfg);font-weight:600;border-radius:6px;padding:7px 10px;font-size:12px;width:100%}

/* note */
.main{overflow-y:auto}
.note{max-width:820px;padding:28px 40px 56px;margin:0 auto}
.crumb{font-size:12px;color:var(--mu)}
.note h1{font-size:26px;font-weight:600;letter-spacing:-0.02em;margin:8px 0 0;line-height:1.3;text-wrap:balance}
.meta{display:flex;gap:6px;align-items:center;margin-top:12px;font-size:12px;color:var(--mu);flex-wrap:wrap}
.g{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid}
.g-law,.g-reg{color:var(--acc);border-color:var(--acc);background:var(--accw)}
.g-std{color:var(--ok);border-color:var(--ok);background:var(--okw)}
.g-sup,.g-prac{color:var(--mu);border-color:var(--gray);background:var(--grayw)}
.g-chk{color:var(--warnfg);border-color:var(--warn);background:var(--warnw)}
.alias{font-size:12px;color:var(--fg2);background:var(--grayw);padding:2px 8px;border-radius:4px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;margin-left:4px}
.body{margin-top:22px;display:flex;flex-direction:column;gap:12px;line-height:1.75;font-size:14.5px;color:var(--fg2)}
.body h2{font-size:13px;font-weight:600;color:var(--fg);margin:16px 0 0}
.body p{margin:0}
.body ul,.body ol{margin:0;padding-left:20px;display:grid;gap:4px}
.l{color:var(--acc);font-weight:500;cursor:pointer;text-decoration:none}
.l:hover{text-decoration:underline}
.l.miss{color:var(--warnfg);cursor:default}
.facts{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fhead{display:grid;grid-template-columns:minmax(0,1fr) 220px 92px;gap:16px;padding:9px 14px;background:var(--canvas);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--fg2)}
.fact{display:grid;grid-template-columns:minmax(0,1fr) 220px 92px;gap:16px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2);line-height:1.6;color:var(--fg)}
.fact:last-child{border-bottom:0}
.fact:hover{background:var(--hover)}
.fsrc{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.checks li{color:var(--warnfg)}
.srcs{display:flex;flex-direction:column;gap:4px;font-size:13px}
.srcs a{text-decoration:none}
.srcs a:hover{text-decoration:underline}
.foot{margin-top:36px;border-top:1px solid var(--line);padding-top:18px;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:24px}
.foot h3{font-size:12px;color:var(--mu);font-weight:600;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);color:var(--fg2);background:var(--panel)}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.graph{width:100%;height:150px;border:1px solid var(--line);border-radius:var(--r);background:var(--canvas);display:block}
.graph text{font-size:9px;fill:var(--mu);font-family:var(--f);cursor:pointer}
.graph line{stroke:var(--line);stroke-width:1}
.graph .n{fill:var(--gray);cursor:pointer}
.graph .c{fill:var(--acc)}
.oi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:baseline}
.gaprow{padding:12px 0;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:4px}
.gaprow b{color:var(--fg);font-weight:600}
.gaprow span{font-size:12px;color:var(--mu)}

/* chat */
.chat{display:flex;flex-direction:column}
.chat-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-h b{font-size:15px;font-weight:600}
.chat-h span{font-size:11px;color:var(--mu)}
.msgs{flex:1;padding:16px 18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0}
.me{align-self:flex-end;background:var(--acc);color:var(--onacc);padding:9px 13px;border-radius:10px 10px 2px 10px;max-width:85%;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{align-self:flex-start;background:var(--canvas);border:1px solid var(--line);padding:11px 13px;border-radius:10px 10px 10px 2px;max-width:94%;line-height:1.7;color:var(--fg);overflow-wrap:anywhere}
.bot p{margin:0 0 6px} .bot p:last-child{margin:0}
.bot ul{margin:4px 0;padding-left:18px}
.bot.missbox{border-color:var(--warn);background:var(--warnw)}
.bot .tag{display:block;color:var(--warnfg);font-size:12px;font-weight:600;margin-bottom:4px}
.bot.err{background:var(--warnw);border-color:var(--warn);color:var(--warnfg)}
.thinking{color:var(--mu)}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg p{font-size:12px;color:var(--mu);margin:0 0 2px}
.sugg button{text-align:left;font-size:13px;padding:9px 12px;border-radius:6px;border:1px solid var(--line);color:var(--fg2);background:var(--panel)}
.sugg button:hover{border-color:var(--acc);color:var(--acc)}
.hint{font-size:11px;color:var(--mu);margin:0 18px 8px}
.ask{margin:0 14px 14px;border:1px solid var(--line);border-radius:8px;padding:8px 8px 8px 12px;display:flex;align-items:flex-end;gap:8px;background:var(--panel)}
.ask:focus-within{border-color:var(--acc)}
.ask textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font:inherit;color:var(--fg);line-height:1.5;max-height:120px;padding:4px 0;min-width:0}
.send{background:var(--acc);color:var(--onacc);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;flex:none}
.send[disabled]{opacity:.4;cursor:default}

@media (max-width:1180px){.app{grid-template-columns:240px minmax(0,1fr) 320px}.note{padding:24px 24px 48px}.fhead,.fact{grid-template-columns:minmax(0,1fr) 160px 84px}}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr);gap:0;padding:0;padding-top:env(safe-area-inset-top,0px)}
  .top{margin:0}
  .top .sum{display:none}
  .tabs{display:flex;gap:4px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
  .tabs button{flex:1;height:34px;border-radius:6px;font-weight:600;font-size:13px;color:var(--mu)}
  .tabs button[aria-pressed="true"]{background:var(--sel);color:var(--fg)}
  .side,.main,.chat{grid-row:3;grid-column:1;border:0;border-radius:0}
  .app[data-pane="list"] .main,.app[data-pane="list"] .chat{display:none}
  .app[data-pane="note"] .side,.app[data-pane="note"] .chat{display:none}
  .app[data-pane="chat"] .side,.app[data-pane="chat"] .main{display:none}
  .side{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .note{padding:20px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
  .note h1{font-size:22px}
  .fhead{display:none}
  .fact{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .fact > span:first-child{grid-column:1/-1}
  .foot{grid-template-columns:1fr}
}
</style>

<div class="app" id="app" data-pane="note">
  <header class="top">
    <div class="brand"><span class="mark">a</span>auditLab Wiki</div>
    <div class="sum"><span><i class="dot d-verified"></i><b id="s-v"></b> 원문 대조</span><span><i class="dot d-kb"></i><b id="s-k"></b> v3.0 이관</span><span><i class="dot d-check"></i><b id="s-c"></b> 확인 필요</span></div>
  </header>
  <nav class="tabs" aria-label="화면">
    <button data-pane="list" aria-pressed="false">목록</button>

      <input id="q" type="search" placeholder="노트·조문·내용 검색" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="filters" id="filters" role="group" aria-label="근거 등급 필터"></div>
    <div class="tree" id="tree"></div>
    <div class="sfoot">
      <button class="gapbtn" id="gapbtn"><span>위키에 없는 질문</span><span id="gapcnt">0건</span></button>

  <main class="main" id="main"><article class="note" id="note"></article></main>

  <section class="chat" aria-label="위키에게 묻기">

    <form class="ask" id="ask">
      <textarea id="input" rows="1" placeholder="궁금한 걸 물어보세요"></textarea>
      <button class="send" id="send" type="submit">보내기</button>
    </form>
  </section>
</div>

const W={"notes": [{"title": "확인 필요 목록", "type": "안내", "aliases": ["확인 필요"], "status": "virtual", "id": "n307ae253", "intro": "", "facts": [], "sections": [], "checks": [], "sources": [], "verified": "", "file": "", "backlinks": ["n6968dbb3"], "links": ["n27412c45", "nf0e06a6a", "n21439867", "n2e86628f", "n6968dbb3", "n6f129e3d", "n5841f8d1", "n9b0eb69d", "n766fa1d4", "n9597cd9b", "n34abf717"]}, {"title": "위키에 없는 질문", "type": "안내", "aliases": ["빈칸 목록"], "status": "virtual", "id": "n66299ff9", "intro": "", "facts": [], "sections": [], "checks": [], "sources": [], "verified": "", "file": "", "backlinks": [], "links": []}, {"title": "시작하기", "type": "안내", "aliases": ["index", "홈"], "status": "kb", "verified": "", "sources": [], "intro": "회계사 업무를 법적 근거가 있는 사실만으로 쌓는 위키예요. 노트 하나에 개념 하나를 담고, 사실마다 근거와 등급을 달아요.", "facts": [{"text": "등급은 위로 갈수록 구속력이 강해요: 법률 > 시행령·규정 > 기준 > 감독기관 > 관행 > 확인 필요", "src": "위키 규칙", "grade": "관행"}, {"text": "노트 상태: 원문 대조(verified), v3.0에서 옮김(kb), 확인할 것 있음(check)", "src": "위키 규칙", "grade": "관행"}], "sections": [{"name": "연결", "text": "처음이라면 이 순서로 읽어 보세요.\n1. [[규칙 체계]]: 회계사를 묶는 다섯 층\n2. [[감사인]]: 누가 감사하나\n3. [[01 수임·독립성]]부터 [[09 조서 마감·보존]]까지: 감사의 흐름\n4. [[감사조서]]: 모든 절차가 남기는 기록\n5. [[연간 감사 일정]]: 언제 무엇을 하나\n6. [[제재 체계]]: 잘못되면 어떻게 되나"}], "checks": [], "file": "안내/시작하기.md", "id": "n389b82de", "links": ["n1372876c", "neab1459f", "n65ef6c36", "n21439867", "n27412c45", "n7ac39497", "ndd82f3f5"], "grades": ["관행"], "backlinks": ["n1372876c"]}, {"title": "PBC", "type": "개념", "aliases": ["Prepared By Client", "요청자료"], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "Prepared By Client. 회사가 준비해 감사인에게 내는 자료, 또는 그 요청목록이에요.", "facts": [{"text": "감사인은 회사에 회계 장부·서류 열람·복사와 자료 제출을 요구할 수 있고 회사는 지체 없이 따라야 함", "src": "외부감사법 제21조①", "grade": "법률"}, {"text": "요청목록은 엑셀이나 포털로 관리하고, 누락·기한·수정본 여부를 추적", "src": "지식베이스 v3.0", "grade": "관행"}], "sections": [{"name": "연결", "text": "[[04 자료 요청]], [[외부감사법 제21조]]"}], "checks": [], "file": "개념/PBC.md", "id": "n084d2468", "links": ["ncf774f99", "ned4ed616"], "grades": ["법률", "관행"], "backlinks": ["n9f014ff2", "ncf774f99", "ned4ed616", "n5a2c4301"]}, {"title": "감리", "type": "개념", "aliases": [], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "외부감사법 제26조", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제26조"}, {"label": "데일리안 2026 계획", "url": "https://www.dailian.co.kr/news/view/1626714/"}], "intro": "감독기관이 재무제표, 감사보고서, 회계법인 품질관리를 점검하는 절차예요. 행정 제재로 이어져요.", "facts": [{"text": "감사보고서의 감사기준 준수, 재무제표의 회계처리기준 준수, 감사인의 품질관리기준 준수를 감리", "src": "외부감사법 제26조①", "grade": "법률"}, {"text": "2026년 계획: 재무제표 심사·감리 170곳, 감사인 감리 10곳", "src": "금감원 2026 계획 보도", "grade": "감독기관"}, {"text": "품질관리 감리 개선권고는 권고일부터 3년간 금감원 홈페이지에 게시", "src": "금융위·금감원 2026.6", "grade": "감독기관"}], "sections": [{"name": "연결", "text": "[[제재 체계]], [[증권선물위원회]], [[금융감독원]]"}], "checks": [], "file": "개념/감리.md", "id": "n0329b6e7", "links": ["ndd82f3f5", "n628f3fdb", "n0f4d6210"], "grades": ["법률", "감독기관"], "backlinks": ["ndd82f3f5", "nc75e6f70", "n0f4d6210", "n628f3fdb"]}, {"title": "감사 자료", "type": "개념", "aliases": ["TB", "GL", "시산표", "총계정원장"], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "감사에서 회사와 감사인 사이에 오가는 문서와 데이터예요.", "facts": [{"text": "PBC 요청목록: 감사인 작성, 회사 대응. 엑셀·포털", "src": "지식베이스 v3.0", "grade": "관행"}, {"text": "재무제표(FS), 합계잔액시산표(TB), 총계정원장(GL), 보조명세: 회사 작성. 엑셀·CSV·PDF·HWP", "src": "지식베이스 v3.0", "grade": "관행"}, {"text": "거래 증빙: 세금계산서, 계약서, 송장, 통장 내역. PDF·XML·이미지", "src": "지식베이스 v3.0", "grade": "관행"}, {"text": "조회서 회신: 은행·거래처가 감사인에게 직접. 전자 회신·우편", "src": "지식베이스 v3.0", "grade": "관행"}, {"text": "감사조서, 리뷰 코멘트: 감사인 작성", "src": "지식베이스 v3.0", "grade": "관행"}], "sections": [{"name": "연결", "text": "[[PBC]], [[감사조서]], [[외부조회]], [[매출채권 검증 경로]]"}], "checks": [], "file": "개념/감사 자료.md", "id": "n9f014ff2", "links": ["n084d2468", "n27412c45", "n6bc1daae", "nf0e06a6a"], "grades": ["관행"], "backlinks": ["nf0e06a6a", "ncf774f99"]}, {"title": "감사의견", "type": "개념", "aliases": ["적정의견", "한정의견"], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "감사인이 재무제표에 대해 내리는 최종 결론이에요.", "facts": [{"text": "의견은 적정, 한정, 부적정, 의견거절 4종", "src": "감사기준서 700 · 705", "grade": "기준"}, {"text": "감사보고서는 감사의견을 표명한 보고서로 정의", "src": "외부감사법 제2조제8호", "grade": "법률"}], "sections": [{"name": "연결", "text": "의견은 감사인(업무수행이사)이 내요. 도구가 의견을 내거나 확정하면 안 돼요. [[08 완료·보고]], [[업무수행이사]]"}], "checks": [], "file": "개념/감사의견.md", "id": "nbd206343", "links": ["na90c2629", "n11a21f73"], "grades": ["법률", "기준"], "backlinks": ["n2b78e798", "n1f37a62e", "na90c2629", "n11a21f73"]}, {"title": "감사조서", "type": "개념", "aliases": ["워킹페이퍼", "W/P", "조서"], "status": "check", "verified": "", "sources": [{"label": "외부감사법 제19조", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제19조"}, {"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "감사인이 수행한 절차, 입수한 증거, 내린 결론을 적은 기록이에요. 전자 파일도 포함돼요. 감사인이 [[외부감사법 제31조]] 손해배상에서 책임을 면하려면 임무를 게을리하지 않았음을 보여야 하는데, 그 핵심 자료가 조서예요.", "facts": [{"text": "감사의견을 표명하면 감사절차·입수 정보·분석결과를 문서화해야 함", "src": "외부감사법 제19조①", "grade": "법률"}, {"text": "자기테이프·디스켓 등 정보보존장치도 조서에 포함", "src": "외부감사법 제19조①", "grade": "법률"}, {"text": "감사종료 시점부터 8년 보존", "src": "외부감사법 제19조②", "grade": "법률"}, {"text": "위조·변조·훼손·파기 시 5년 이하 징역 또는 5천만원 이하 벌금", "src": "외부감사법 제19조③ · 제41조제2호", "grade": "법률"}, {"text": "작성 방법과 최종 정리는 감사기준서 230", "src": "감사기준서 230", "grade": "기준"}, {"text": "최종 조서 정리 기한은 ISA 기준 보고서일 후 통상 60일", "src": "감사기준서 230", "grade": "확인 필요"}], "sections": [{"name": "연결", "text": "[[06 실증절차]]에서 계정별로 만들고 [[07 리뷰]]를 거쳐 [[09 조서 마감·보존]]에서 잠가요. 법 조문은 [[외부감사법 제19조]], [[외부감사법 제41조]]."}], "checks": ["감사기준서 230의 최종 조서 정리 기한 원문"], "file": "개념/감사조서.md", "id": "n27412c45", "links": ["n5841f8d1", "n4265cab6", "n42559c0f", "n21439867", "n8df89fb8", "n9be1530c"], "grades": ["법률", "기준", "확인 필요"], "backlinks": ["n389b82de", "n9f014ff2", "nbceb87ec", "n42559c0f", "n21439867", "n8df89fb8", "n9be1530c"]}, {"title": "경영진 주장", "type": "개념", "aliases": ["Assertion", "주장"], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "재무제표의 숫자 하나하나에는 회사가 하는 '주장'이 담겨 있다고 봐요. 감사인은 주장별로 증거를 모아요.", "facts": [{"text": "주요 주장: 실재성, 완전성, 평가, 기간귀속, 권리와 의무, 표시", "src": "감사기준서 315", "grade": "기준"}, {"text": "합계가 맞아도 실재성·평가·기간귀속은 각각 판단해야 하며 숫자 대사로 대체되지 않음", "src": "지식베이스 v3.0", "grade": "관행"}], "sections": [{"name": "연결", "text": "[[기간귀속]], [[실증절차]], [[매출채권 검증 경로]]"}], "checks": [], "file": "개념/경영진 주장.md", "id": "ncdb66491", "links": ["n785d513b", "n8f9f4d42", "nf0e06a6a"], "grades": ["기준", "관행"], "backlinks": ["n785d513b", "nf0e06a6a", "n77b1d2ae", "n3f7f89fe"]}, {"title": "계속기업", "type": "개념", "aliases": [], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "회사가 앞으로도 영업을 계속할 수 있는지에 대한 판단이에요.", "facts": [{"text": "계속기업 검토는 감사기준서 570", "src": "감사기준서 570", "grade": "기준"}], "sections": [{"name": "연결", "text": "[[08 완료·보고]], [[감사의견]]"}], "checks": [], "file": "개념/계속기업.md", "id": "n2b78e798", "links": ["na90c2629", "nbd206343"], "grades": ["기준"], "backlinks": ["na90c2629"]}, {"title": "규칙 체계", "type": "개념", "aliases": ["규칙 5층"], "status": "verified", "verified": "2026-10-21", "sources": [], "intro": "회계사가 따르는 규칙은 다섯 층으로 내려와요. 위로 갈수록 구속력이 강하고, 아래로 갈수록 구체적이에요.", "facts": [{"text": "1층 법률: 외부감사법(법률 제20896호, 2025.4.1 시행), 공인회계사법(법률 제20055호, 2024.1.16 시행)", "src": "국가법령정보센터", "grade": "법률"}, {"text": "2층 시행령·규정: 외부감사법 시행령, 외부감사 및 회계 등에 관한 규정(금융위 고시), 같은 규정 시행세칙(금감원)", "src": "국가법령정보센터", "grade": "시행령·규정"}, {"text": "3층 직업 기준: 회계감사기준, 품질관리기준 (한공회 제정, 금융위 승인)", "src": "외부감사법 제16·17조", "grade": "법률"}, {"text": "4층 직업윤리: 공인회계사 윤리기준, 한공회 회칙 (회칙 준수 의무는 공인회계사법 제16조)", "src": "공인회계사법 제16조", "grade": "법률"}, {"text": "5층 법인 내부: 감사 매뉴얼, 조서 양식, 품질관리 정책", "src": "지식베이스 v3.0", "grade": "관행"}, {"text": "회사 쪽 규칙은 별도의 회계처리기준", "src": "지식베이스 v3.0", "grade": "기준"}], "sections": [{"name": "연결", "text": "[[회계감사기준]], [[품질관리기준]], [[회계처리기준]], [[시작하기]]"}], "checks": [], "file": "개념/규칙 체계.md", "id": "n1372876c", "links": ["n54e31fea", "ndaa461fd", "n65b34dff", "n389b82de"], "grades": ["법률", "시행령·규정", "기준", "관행"], "backlinks": ["n389b82de", "n54e31fea", "n65b34dff"]}, {"title": "기간귀속", "type": "개념", "aliases": ["컷오프", "Cut-off"], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "거래가 올바른 회계기간에 기록됐는지를 말해요. 결산일 직전·직후 거래가 주된 위험이에요.", "facts": [{"text": "기간귀속은 경영진 주장 중 하나", "src": "감사기준서 315", "grade": "기준"}], "sections": [{"name": "연결", "text": "[[경영진 주장]], [[매출채권 검증 경로]]"}], "checks": [], "file": "개념/기간귀속.md", "id": "n785d513b", "links": ["ncdb66491", "nf0e06a6a"], "grades": ["기준"], "backlinks": ["ncdb66491", "nf0e06a6a"]}, {"title": "독립성", "type": "개념", "aliases": [], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "공인회계사법 제21조", "url": "https://www.law.go.kr/법령/공인회계사법/제21조"}], "intro": "감사인이 감사 대상 회사와 얽히지 않아야 한다는 원칙이에요. 법, 기준, 윤리가 모두 요구해요.", "facts": [{"text": "공인회계사는 직무를 할 때 독립성을 유지해야 함", "src": "공인회계사법 제15조①", "grade": "법률"}, {"text": "본인·배우자가 임원·직원(과거 1년 포함)인 회사는 감사 불가", "src": "공인회계사법 제21조①", "grade": "법률"}, {"text": "감사계약 기간 중 회계기록 작성, 재무정보체제 구축·운영 등 금지", "src": "공인회계사법 제21조②", "grade": "법률"}, {"text": "회계법인이 주식을 가진 회사는 감사 불가", "src": "공인회계사법 제33조①", "grade": "법률"}, {"text": "회계감사기준에는 독립성 유지 요건이 포함돼야 함", "src": "외부감사법 시행령 제22조①", "grade": "시행령·규정"}], "sections": [{"name": "연결", "text": "[[01 수임·독립성]], [[공인회계사법 제21조]], [[공인회계사법 제33조]]"}], "checks": [], "file": "개념/독립성.md", "id": "n569e5b72", "links": ["n65ef6c36", "nd90d99b2", "n1f340f91"], "grades": ["법률", "시행령·규정"], "backlinks": ["n65ef6c36", "nf8c9c3c8", "nd90d99b2", "n1f340f91"]}, {"title": "리뷰 코멘트", "type": "개념", "aliases": ["리뷰 노트", "Review note"], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "상위자가 조서에 남기는 보완 요구예요. 하위자가 보완하고 상위자가 다시 확인해요.", "facts": [{"text": "검토 체계는 감사기준서 220, 문서화는 230", "src": "감사기준서 220 · 230", "grade": "기준"}, {"text": "흐름은 보통 시니어 → 매니저 → 파트너", "src": "지식베이스 v3.0", "grade": "관행"}], "sections": [{"name": "연결", "text": "[[07 리뷰]], [[감사조서]]"}], "checks": [], "file": "개념/리뷰 코멘트.md", "id": "nbceb87ec", "links": ["n42559c0f", "n27412c45"], "grades": ["기준", "관행"], "backlinks": ["n42559c0f"]}, {"title": "매출채권 검증 경로", "type": "개념", "aliases": ["매출채권"], "status": "check", "verified": "", "sources": [], "intro": "계정 하나가 재무제표에서 증빙까지 어떻게 거슬러 올라가 검증되는지 보여주는 예시예요.", "facts": [{"text": "재무제표 금액 ↔ 시산표 잔액 ↔ 총계정원장·거래처별 명세 ↔ 세금계산서·계약서·기말 후 입금·채권 조회서 → 조서 → 리뷰", "src": "지식베이스 v3.0", "grade": "관행"}, {"text": "합계 일치와 별개로 실재성, 평가(회수 가능성), 기간귀속을 각각 판단", "src": "감사기준서 315", "grade": "기준"}, {"text": "법인은 규모와 관계없이 전자세금계산서 발급 의무", "src": "부가가치세법 제32조②", "grade": "확인 필요"}], "sections": [{"name": "연결", "text": "[[경영진 주장]], [[외부조회]], [[기간귀속]], [[감사 자료]]"}], "checks": ["부가가치세법 제32조② 원문 대조 (K-Tieout 아이디어의 전제)"], "file": "개념/매출채권 검증 경로.md", "id": "nf0e06a6a", "links": ["ncdb66491", "n6bc1daae", "n785d513b", "n9f014ff2"], "grades": ["기준", "관행", "확인 필요"], "backlinks": ["n9f014ff2", "ncdb66491", "n785d513b", "n4265cab6"]}, {"title": "미수정 왜곡표시", "type": "개념", "aliases": [], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "감사 중 발견했지만 회사가 고치지 않은 오류들이에요. 쌓인 합계가 [[중요성]]을 넘는지 평가해 의견에 반영해요.", "facts": [{"text": "미수정 왜곡표시 평가는 감사기준서 450", "src": "감사기준서 450", "grade": "기준"}], "sections": [{"name": "연결", "text": "[[08 완료·보고]], [[감사의견]]"}], "checks": [], "file": "개념/미수정 왜곡표시.md", "id": "n1f37a62e", "links": ["nf8a0aa08", "na90c2629", "nbd206343"], "grades": ["기준"], "backlinks": ["nf8a0aa08", "na90c2629"]}, {"title": "분개 테스트", "type": "개념", "aliases": ["JET", "Journal Entry Test"], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "비정상적인 분개(장부 기록)를 찾아 경영진이 통제를 무력화했을 위험에 대응하는 절차예요.", "facts": [{"text": "분개 테스트는 부정 위험을 다루는 감사기준서 240에 근거", "src": "감사기준서 240", "grade": "기준"}], "sections": [{"name": "연결", "text": "[[06 실증절차]], [[위험평가]]"}], "checks": [], "file": "개념/분개 테스트.md", "id": "n9d48a051", "links": ["n4265cab6", "n77b1d2ae"], "grades": ["기준"], "backlinks": ["n8f9f4d42", "n4265cab6"]}, {"title": "분석적 절차", "type": "개념", "aliases": [], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "비율과 추세를 비교해 이상하게 변한 곳을 찾는 절차예요. 어디를 더 깊이 볼지 정할 때도 써요.", "facts": [{"text": "분석적 절차는 감사기준서 520", "src": "감사기준서 520", "grade": "기준"}], "sections": [{"name": "연결", "text": "[[실증절차]]"}], "checks": [], "file": "개념/분석적 절차.md", "id": "n16347646", "links": ["n8f9f4d42"], "grades": ["기준"], "backlinks": ["n8f9f4d42"]}, {"title": "실증절차", "type": "개념", "aliases": [], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "금액 자체가 맞는지 직접 검증하는 절차예요. 증빙 확인, 재계산, 조회, 분석이 모두 여기에 들어가요.", "facts": [{"text": "실증절차의 기본 틀은 감사기준서 330, 감사증거는 500", "src": "감사기준서 330 · 500", "grade": "기준"}, {"text": "세부 절차: 재고실사 입회(501), 외부조회(505), 분석적 절차(520), 표본감사(530), 분개 테스트(240)", "src": "감사기준서", "grade": "기준"}], "sections": [{"name": "연결", "text": "[[06 실증절차]], [[외부조회]], [[분석적 절차]], [[표본감사]], [[분개 테스트]], [[재고실사 입회]]"}], "checks": [], "file": "개념/실증절차.md", "id": "n8f9f4d42", "links": ["n4265cab6", "n6bc1daae", "n16347646", "n8bc55297", "n9d48a051", "n86f2f0c5"], "grades": ["기준"], "backlinks": ["ncdb66491", "n16347646", "n77b1d2ae", "n8bc55297", "n4265cab6"]}, {"title": "연간 감사 일정", "type": "개념", "aliases": ["법정 기한", "비지 시즌", "일정"], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "국회 입법예고", "url": "https://opinion.lawmaking.go.kr/gcom/nsmLmSts/out/2219264/detailRP"}], "intro": "12월 결산 회사 기준 1년 흐름이에요. 법정 기한은 \"정기총회 며칠 전\"처럼 총회일에 연동돼서 회사마다 날짜가 달라요.", "facts": [{"text": "사업연도 개시일부터 45일 이내 감사인 선임", "src": "외부감사법 제10조①", "grade": "법률"}, {"text": "하반기(보통 9~12월) 계획, 위험평가, 중간감사, 통제 테스트", "src": "지식베이스 v3.0", "grade": "관행"}, {"text": "12월 31일 전후 재고실사 입회, 조회서 기준일", "src": "지식베이스 v3.0", "grade": "관행"}, {"text": "1~2월 기말감사(비지 시즌)", "src": "지식베이스 v3.0", "grade": "관행"}, {"text": "정기총회 6주 전 회사가 감사인에게 재무제표 제출", "src": "외부감사법 시행령 제8조①", "grade": "시행령·규정"}, {"text": "정기총회 1주 전 감사인이 회사에 감사보고서 제출", "src": "외부감사법 시행령 제27조①", "grade": "시행령·규정"}, {"text": "정기총회 종료 후 2주 이내 감사보고서를 증선위·한공회에 제출", "src": "외부감사법 시행령 제27조③", "grade": "시행령·규정"}, {"text": "감사종료 시점부터 8년 조서 보존", "src": "외부감사법 제19조②", "grade": "법률"}, {"text": "상장사 감사보고서 제출을 총회 6주 전으로 앞당기는 개정안이 2026.6.15 발의됨 (미확정)", "src": "국회 입법예고", "grade": "감독기관"}], "sections": [{"name": "연결", "text": "재무제표 제출부터 감사보고서 제출까지 약 5주가 최종 검증 기간이에요. [[외부감사법 시행령 제8조]], [[외부감사법 시행령 제27조]]"}], "checks": [], "file": "개념/연간 감사 일정.md", "id": "n7ac39497", "links": ["na9587540", "neb0f6269"], "grades": ["법률", "시행령·규정", "감독기관", "관행"], "backlinks": ["n389b82de", "n86f2f0c5", "neb0f6269", "na9587540", "n122bc5a1"]}, {"title": "외부조회", "type": "개념", "aliases": ["조회서", "Confirmation"], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}, {"label": "KICPA·NICE 전자조회", "url": "https://kicpa.nicebizline.com/rp/RP0400M001GE.nice"}], "intro": "은행이나 거래처에 잔액을 직접 확인받는 절차예요. 회사가 아닌 제3자가 확인한 증거라 증거력이 높아요.", "facts": [{"text": "외부조회는 감사기준서 505", "src": "감사기준서 505", "grade": "기준"}, {"text": "법정 서식은 금융거래조회, 채권채무조회, 변호사조회 실시 여부를 O(실시), X(대상 있으나 생략), -(대상 없음)으로 적게 함", "src": "시행세칙 별지 제4호", "grade": "시행령·규정"}, {"text": "한공회·NICE 채권채무 전자조회 서비스가 있음", "src": "KICPA·NICE 안내", "grade": "감독기관"}, {"text": "미회신 시 대체절차를 수행", "src": "지식베이스 v3.0", "grade": "관행"}], "sections": [{"name": "연결", "text": "[[06 실증절차]], [[외부감사 실시내용]]"}], "checks": [], "file": "개념/외부조회.md", "id": "n6bc1daae", "links": ["n4265cab6", "n4ca99f73"], "grades": ["시행령·규정", "기준", "감독기관", "관행"], "backlinks": ["n9f014ff2", "nf0e06a6a", "n8f9f4d42", "n4265cab6", "n4ca99f73"]}, {"title": "위험평가", "type": "개념", "aliases": [], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "재무제표 어디에서 왜곡표시가 생길 위험이 큰지 평가하는 절차예요. 감사인은 모든 거래를 보지 않고, 위험이 큰 곳에 절차를 집중해요.", "facts": [{"text": "위험평가는 감사기준서 315, 부정 위험은 240", "src": "감사기준서 315 · 240", "grade": "기준"}, {"text": "평가한 위험에 대응하는 절차 설계는 감사기준서 330", "src": "감사기준서 330", "grade": "기준"}], "sections": [{"name": "연결", "text": "[[03 위험평가]], [[경영진 주장]], [[통제 테스트]], [[실증절차]]"}], "checks": [], "file": "개념/위험평가.md", "id": "n77b1d2ae", "links": ["n3f7f89fe", "ncdb66491", "n712e46c6", "n8f9f4d42"], "grades": ["기준"], "backlinks": ["n9d48a051", "n3f7f89fe"]}, {"title": "재고실사 입회", "type": "개념", "aliases": [], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "회사가 재고를 세는 현장에 감사인이 참관하고 일부를 직접 세어 보는 절차예요.", "facts": [{"text": "재고실사 입회는 감사기준서 501", "src": "감사기준서 501", "grade": "기준"}, {"text": "법정 서식은 실사(입회) 시기, 장소, 대상을 적게 함", "src": "시행세칙 별지 제4호", "grade": "시행령·규정"}, {"text": "12월 결산 회사는 보통 12월 31일 전후에 실시", "src": "지식베이스 v3.0", "grade": "관행"}], "sections": [{"name": "연결", "text": "[[06 실증절차]], [[연간 감사 일정]]"}], "checks": [], "file": "개념/재고실사 입회.md", "id": "n86f2f0c5", "links": ["n4265cab6", "n7ac39497"], "grades": ["시행령·규정", "기준", "관행"], "backlinks": ["n8f9f4d42"]}, {"title": "제재 체계", "type": "개념", "aliases": ["책임", "제재"], "status": "verified", "verified": "2026-10-21", "sources": [], "intro": "감사인은 세 갈래로 책임을 져요. 행정 제재, 형사 처벌, 민사 손해배상이에요.", "facts": [{"text": "행정: 증선위 조치(감사업무 제한, 경고 등)와 금융위 조치(등록취소, 직무정지, 과징금)", "src": "외부감사법 제29조 · 공인회계사법", "grade": "법률"}, {"text": "형사: 조서 위조 5년/5천만원, 대리작성·비밀누설·자료요구 거부 3년/3천만원, 감사보고서 미제출 1년/1천만원", "src": "외부감사법 제41·42·44조", "grade": "법률"}, {"text": "민사: 회사·제3자에 손해배상, 감사반이면 참여 회계사 연대", "src": "외부감사법 제31조", "grade": "법률"}, {"text": "2025년 금감원은 감사·감리 방해를 고의 분식 수준으로 처벌하는 가중사유를 신설", "src": "세종 뉴스레터", "grade": "감독기관"}], "sections": [{"name": "연결", "text": "[[외부감사법 제29조]], [[외부감사법 제31조]], [[외부감사법 제41조]], [[외부감사법 제42조]], [[외부감사법 제44조]], [[감리]]"}], "checks": [], "file": "개념/제재 체계.md", "id": "ndd82f3f5", "links": ["n6f129e3d", "n5841f8d1", "n9be1530c", "n959fa608", "n8ff49f09", "n0329b6e7"], "grades": ["법률", "감독기관"], "backlinks": ["n389b82de", "n0329b6e7", "n6f129e3d", "nc0bebf45", "n628f3fdb"]}, {"title": "중요성", "type": "개념", "aliases": ["Materiality", "중요성 금액"], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "\"이 금액 이상 틀리면 재무제표 이용자의 판단이 달라진다\"고 보는 기준 금액이에요. 감사 범위를 정하는 출발점이에요.", "facts": [{"text": "중요성 결정은 감사기준서 320", "src": "감사기준서 320", "grade": "기준"}, {"text": "법정 서식은 재무제표 전체 중요성, 수행 중요성, 특정 거래유형·계정잔액·공시 중요성을 구분", "src": "시행세칙 별지 제4호", "grade": "시행령·규정"}, {"text": "서식은 벤치마크(예: 법인세비용차감전순이익, 매출액, 자산총액)와 적용 비율, 선택 사유를 적게 함", "src": "시행세칙 별지 제4호", "grade": "시행령·규정"}, {"text": "중요성 금액을 일반 공개 감사보고서에 넣는 건 선택 사항", "src": "외부감사규정 제19조①", "grade": "시행령·규정"}], "sections": [{"name": "연결", "text": "[[02 계획·중요성]]에서 정하고, [[미수정 왜곡표시]] 평가의 기준이 돼요. [[외부감사 실시내용]]"}], "checks": [], "file": "개념/중요성.md", "id": "nf8a0aa08", "links": ["n91c11dbe", "n1f37a62e", "n4ca99f73"], "grades": ["시행령·규정", "기준"], "backlinks": ["n1f37a62e", "n91c11dbe", "n4ca99f73"]}, {"title": "지정감사", "type": "개념", "aliases": ["감사인 지정", "주기적 지정"], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "외부감사법 제11조", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제11조"}], "intro": "회사가 고른 감사인이 아니라 증권선물위원회가 정해 준 감사인에게 받는 감사예요.", "facts": [{"text": "사유가 있으면 증선위가 3개 사업연도 범위에서 감사인 지정", "src": "외부감사법 제11조①", "grade": "법률"}, {"text": "상장법인 등이 6개 사업연도 연속 자유선임하면 지정 가능 (주기적 지정)", "src": "외부감사법 제11조②", "grade": "법률"}, {"text": "주기적 지정제는 모든 상장회사가 1회 이상 지정받는 2028년까지 운영 예정", "src": "삼일 GAAS 2025.10", "grade": "감독기관"}], "sections": [{"name": "연결", "text": "감사인 교체가 잦아지면 [[초도감사]]가 늘어나요. [[외부감사법 제11조]]"}], "checks": [], "file": "개념/지정감사.md", "id": "n19a999d7", "links": ["n5ec7a819", "n9af55ba8"], "grades": ["법률", "감독기관"], "backlinks": ["n5ec7a819", "n9af55ba8", "n628f3fdb"]}, {"title": "초도감사", "type": "개념", "aliases": [], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "외부감사법 제10조", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제10조"}], "intro": "감사인이 그 회사를 처음 감사하는 것이에요. 전기 자료를 처음부터 파악해야 해서 부담이 커요.", "facts": [{"text": "전기 감사인이 다르면 실시내용 서식의 전기 수치는 전기 감사인 감사보고서의 실시내용에서 가져와 각주로 밝힘", "src": "시행세칙 별지 제4호", "grade": "시행령·규정"}, {"text": "직전 사업연도에 감사를 받지 않은 회사는 사업연도 개시일부터 4개월 이내 감사인 선임", "src": "외부감사법 제10조②", "grade": "법률"}], "sections": [{"name": "연결", "text": "v3.0의 \"초도감사 선임기한 4개월\"은 정확히는 '직전 연도 미감사 회사' 기준이에요. [[외부감사법 제10조]], [[지정감사]]"}], "checks": [], "file": "개념/초도감사.md", "id": "n5ec7a819", "links": ["n122bc5a1", "n19a999d7"], "grades": ["법률", "시행령·규정"], "backlinks": ["n19a999d7", "n122bc5a1"]}, {"title": "통제 테스트", "type": "개념", "aliases": ["ToC"], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "회사의 내부통제가 실제로 작동했는지 표본으로 확인하는 절차예요. 통제가 잘 돌면 실증절차 범위를 줄일 수 있어요.", "facts": [{"text": "통제 테스트는 감사기준서 330", "src": "감사기준서 330", "grade": "기준"}, {"text": "내부회계관리제도의 근거는 외부감사법 제8조", "src": "외부감사법 제8조", "grade": "법률"}, {"text": "주로 스태프·시니어가 수행", "src": "지식베이스 v3.0", "grade": "관행"}], "sections": [{"name": "연결", "text": "[[05 통제 테스트]], [[표본감사]]"}], "checks": [], "file": "개념/통제 테스트.md", "id": "n712e46c6", "links": ["nc027439c", "n8bc55297"], "grades": ["법률", "기준", "관행"], "backlinks": ["n77b1d2ae", "n8bc55297", "nc027439c"]}, {"title": "표본감사", "type": "개념", ": "개념/품질관리기준.md", "id": "ndaa461fd", "links": ["n1c0aee58", "n05dd5207"], "grades": ["법률", "감독기관"], "backlinks": ["n1372876c", "n05dd5207", "n51da56fc", "n1c0aee58"]}, {"title": "핵심감사사항", "type": "개념", "aliases": ["KAM"], "status": "kb", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "감사에서 가장 중요했던 사항을 감사보고서에 적는 것이에요.", "facts": [{"text": "핵심감사사항은 감사기준서 701", "src": "감사기준서 701", "grade": "기준"}, {"text": "상장법인 감사에서 핵심감사항목 선정을 위해 감사(감사위원회)와 논의한 대면 회의 횟수·참석자·논의 내용을 감사보고서에 기재", "src": "외부감사규정 제19조②", "grade": "시행령·규정"}], "sections": [{"name": "연결", "text": "[[08 완료·보고]], [[외부감사 실시내용]]"}], "checks": [], "file": "개념/핵심감사사항.md", "id": "n78ffd76a", "links": ["na90c2629", "n4ca99f73"], "grades": ["시행령·규정", "기준"], "backlinks": ["na90c2629"]}, {"title": "회계감사기준", "type": "개념", "aliases": ["감사기준", "ISA"], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "외부감사법 제16조", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제16조"}, {"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "감사인이 감사를 어떻게 하는지 정한 기준이에요. 회계사의 일상 업무를 가장 직접 정하는 규칙이에요.", "facts": [{"text": "한공회가 금융위 사전승인을 받아 정함", "src": "외부감사법 제16조②", "grade": "법률"}, {"text": "기준서 번호는 국제감사기준(ISA)과 같은 체계 (예: 505 외부조회)", "src": "지식베이스 v3.0", "grade": "기준"}], "sections": [{"name": "연결", "text": "[[외부감사법 제16조]], [[회계처리기준]], [[감사기준서 번호 체계]], [[규칙 체계]]"}], "checks": [], "file": "개념/회계감사기준.md", "id": "n54e31fea", "links": ["n70348765", "n65b34dff", "n34abf717", "n1372876c"], "grades": ["법률", "기준"], "backlinks": ["n1372876c", "n65b34dff", "n70348765", "n80465eef", "n51da56fc", "n34abf717"]}, {"title": "회계처리기준", "type": "개념", "aliases": ["K-IFRS", "일반기업회계기준"], "status": "kb", "verified": "", "sources": [{"label": "한국회계기준원", "url": "https://www.kasb.or.kr/front/board/accountingAllList.do"}], "intro": "회사가 장부와 재무제표를 만드는 규칙이에요. 감사인이 따르는 규칙이 아니라, 감사인이 \"이 기준대로 만들었는지\" 검증하는 대상이에요.", "facts": [{"t 2호", "grade": "법률"}, {"text": "감사계약 기간 중 해당 회사에 회계기록·재무제표 작성, 내부감사 대행, 재무정보체제 구축·운영 등 10개 유형 업무 금지", "src": "공인회계사법 제21조②", "grade": "법률"}], "sections": [{"name": "연결", "text": "감사 대상 회사에 같은 법인이 시스템을 구축해 주면 제21조②제3호(재무정보체제 구축·운영)에 걸릴 수 있어요. 법인 단위는 [[공인회계사법 제33조]]."}], "checks": [], "file": "법령/공인회계사법 제21조.md", "id": "nd90d99b2", "links": ["n569e5b72", "n1f340f91"], "grades": ["법률"], "backlinks": ["n569e5b72", "n1f340f91"]}, {"title": "공인회계사법 제33조", "type": "법령", "aliases": [], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "국가법령정보센터", "url": "https://www.law.go.kr/법령/공인회계사법/제33조"}], "intro": "회계법인 단위의 직무제한이에요.", "facts": [{"text": "회계법인이 주식을 소유하거나 출자한 회사는 감사·증명 불가", "src": "공인회계사법 제33조①제1호", "grade": "법률"}, {"text": "회계법인 사원이 제21조① 관계에 있는 회사도 불가", "src": "공인회계사법 제33조①제2호", "grade": "법률"}, {"text": "제21조②③(감사계약 기간 중 금지 업무)은 회계법인에도 준용", "src": "공인회계사법 제33조②", "grade": "법률"}], "sections": [{"name": "연결", "text": "[[공인회계사법 제21조]], [[독립성]]"}], "checks": [], "file": "법령/공인회계사법 제33조.md", "id": "n1f340f91", "links": ["nd90d99b2", "n569e5b72"], "grades": ["법률"], "backlinks": ["n569e5b72", "nd90d99b2"]}, {"title": "공인회계사법 제46조", "type": "법령", "aliases": ["연수", "CPE"], "status": "check", "verified": "", "sources": [{"label": "국가법령정보센터", "url": "https://www.law.go.kr/법령/공인회계사법/제46조"}, {"label": "한공회 소개", "url": "http://kicpa.org/kicpa/jsp/contents/kr/b01_01_04.jsp"}], "intro": "공인회계사 연수의 법적 근거예요.", "facts": [{"text": "한공회는 회원, 등록하려는 자, 사무직원에게 연수를 실시하고 회원의 자체 연수를 지도·감독", "src": "공인회계사법 제46조①", "grade": "법률"}, {"text": "연수를 위해 한공회에 회계연수원을 둠", "src": "공인회계사법 제46조②", "grade": "법률"}, {"text": "연수·감독에 필요한 사항은 한공회가 금융위 승인을 받아 정함", "src": "공인회계사법 제46조③", "grade": "법률"}, {"text": "등록 공인회계사는 연간 40시간 이상, 수습 공인회계사는 2년간 총 200시간 이상 연수", "src": "한공회 공식 안내", "grade": "감독기관"}], "sections": [], "checks": ["회원연수규정 원문: 40시간 산정 기간, 미이수 효과, 윤리 연수 별도 시간"], "file": "법령/공인회계사법 제46조.md", "id": "n2e86628f", "links": [], "grades": ["법률", "감독기관"], "backlinks": ["n3ab06942"]}, {"title": "외부감사법 제2조", "type": "법령", "aliases": ["외감법 제2조"], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "국가법령정보센터", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제2조"}], "intro": "외부감사법의 용어 정의 조항이에요. 누가 [[감사인]]이고 무엇이 감사보고서인지 여기서 정해요.", "facts": [{"text": "감사인은 회계법인 또는 한국공인회계사회에 등록한 감사반", "src": "외부감사법 제2조제7호", "grade": "법률"}, {"text": "감사보고서는 감사인이 회사 재무제표를 회계감사기준에 따라 감사하고 감사의견을 표명한 보고서", "src": "외부감사법 제2조제8호", "grade": "법률"}, {"text": "재무제표는 재무상태표, 손익계산서 또는 포괄손익계산서, 그 밖에 대통령령으로 정하는 서류", "src": "외부감사법 제2조제2호", "grade": "법률"}, {"text": "대형비상장주식회사는 상장법인이 아닌 주식회사 중 직전 사업연도 말 자산총액이 대통령령으로 정하는 금액 이상인 회사", "src": "외부감사법 제2조제5호", "grade": "법률"}], "sections": [{"name": "연결", "text": "[[감사반]], [[일반 회계법인]], [[회계감사기준]]과 이어져요."}], "checks": [], "file": "법령/외부감사법 제2조.md", "id": "n80465eef", "links": ["neab1459f", "n766fa1d4", "n257d4dba", "n54e31fea"], "grades": ["법률"], "backlinks": []}, {"title": "외부감사법 제4조", "type": "법령", "aliases": ["외부감사 대상"], "status": "check", "verified": "", "sources": [{"label": "국가법령정보센터", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제4조"}], "intro": "어떤 회사가 외부감사를 받아야 하는지 정하는 조항이에요.", "facts": [{"text": "주권상장법인, 상장 예정 회사, 자산·부채·종업원수·매출액 등 대통령령 기준에 해당하는 회사는 외부 감사인의 회계감사를 받아야 함", "src": "외부감사법 제4조①", "grade": "법률"}, {"text": "재무제표와 연결재무제표의 감사인은 같아야 함", "src": "외부감사법 제4조①", "grade": "법률"}, {"text": "상장되지 않은 공기업·준정부기관 등은 제외될 수 있음", "src": "외부감사법 제4조②", "grade": "법률"}], "sections": [], "checks": ["대통령령이 정하는 구체적 금액 기준(자산·매출 등)은 시행령 원문으로 정리 전"], "file": "법령/외부감사법 제4조.md", "id": "n9b0eb69d", "links": [], "grades": ["법률"], "backlinks": []}, {"title": "외부감사법 제6조", "type": "법령", "aliases": ["대리작성 금지", "재무제표 작성 책임"], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "국가법령정보센터", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제6조"}], "intro": "재무제표를 누가 만드는지, 감사인이 무엇을 하면 안 되는지 정하는 조항이에요. 감사 도구 설계에서 가장 먼저 지켜야 할 선이에요.", "facts": [{"text": "회사의 대표이사와 회계담당 임원이 재무제표 작성 책임을 짐", "src": "외부감사법 제6조①", "grade": "법률"}, {"text": "회사  [], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "국가법령정보센터", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제16조의2"}], "intro": "[[표준감사시간]]의 근거예요.", "facts": [{"text": "한국공인회계사회는 감사인이 투입해야 할 표준 감사시간을 정할 수 있음", "src": "외부감사법 제16조의2①", "grade": "법률"}, {"text": "3년마다 타당성을 검토해 반영하고 결과를 공개해야 함", "src": "외부감사법 제16조의2②", "grade": "법률"}], "sections": [], "checks": [], "file": "법령/외부감사법 제16조의2.md", "id": "n7b3665c6", "links": ["n3ee5a289"], "grades": ["법률"], "backlinks": []}, {"title": "외부감사법 제17조", "type": "법령", "aliases": [], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "국가법령정보센터", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제17조"}], "intro": "회계법인이 조직 차원에서 지켜야 하는 [[품질관리기준]]의 근거예요.", "facts": [{"text": "감사인은 감사업무 품질 보장을 위한 업무설계·운영 기준(품질관리기준)을 준수해야 함", "src": "외부감사법 제17조①", "grade": "법률"}, {"text": "품질관리기준은 한국공인회계사회가 금융위원회 사전승인을 받아 정함", "src": "외부감사법 제17조②", "grade": "법률"}, {"text": "감사인의 대표자가 품질관리 책임을 지고, 담당 이사 1명을 지정해야 함", "src": "외부감사법 제17조③", "grade": "법률"}], "sections": [], "checks": [], "file": "법령/외부감사법 제17조.md", "id": "n05dd5207", "links": ["ndaa461fd"], "grades": ["법률"], "backlinks": ["ndaa461fd"]}, {"title": "외부감사법 제18조", "type": "법령", "aliases": ["감사보고서 작성"], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "국가법령정보센터", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제18조"}], "intro": "감사보고서를 어떻게 쓰고 무엇을 붙이는지 정하는 조항이에요.", "facts": [{"text": "감사인은 감사결과를 기술한 감사보고서를 작성해야 함", "src": "외부감사법 제18조①", "grade": "법률"}, {"text": "감사보고서에는 감사범위, 감사의견, 이해관계인 의사결정에 유용한 정보가 포함돼야 함", "src": "외부감사법 제18조②", "grade": "법률"}, {"text": "회사 재무제표와 함께, 참여 인원수·감사내용·소요시간 등 외부감사 실시내용 서류를 첨부해야 함", "src": "외부감사법 제18조③", "grade": "법률"}], "sections": [{"name": "연결", "text": "첨부 서류의 세부 항목은 [[외부감사법 시행령 제25조]], 서식은 [[외부감사 실시내용]]."}], "checks": [], "file": "법령/외부감사법 제18조.md", "id": "naf0e303c", "links": ["n96a7db24", "n4ca99f73"], "grades": ["법률"], "backlinks": ["n4ca99f73"]}, {"title": "외부감사법 제19조", "type": "법령", "aliases": ["감사조서 보존"], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "국가법령정보센터", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제19조"}], "intro": "[[감사조서]]를 만들고 지키는 의무예요.", "facts": [{"text": "감사의견을 표명하면 감사절차의 내용, 입수한 정보, 정보의 분석결과 등을 문서화한 감사조서를 작성해야 함", "src": "외부감사법 제19조①", "grade": "법률"}, {"text": "자기테이프·디스켓 등 정보보존장치도 감사조서에 포함", "src": "외부감사법 제19조①", "grade": "법률"}, {"text": "감사종료 시점부터 8년간 보존", "src": "외부감사법 제19조②", "grade": "법률"}, {"text": "감사인과 소속자·사용인은 감사조서를 위조·변조·훼손·파기하면 안 됨", "src": "외부감사법 제19조③", "grade": "법률"}, {"text": "제19조③ 위반은 5년 이하 징역 또는 5천만원 이하 벌금", "src": "외부감사법 제41조제2호", "grade": "법률"}], "sections": [{"name": "연결", "text": "[[외부감사법 제41조]], [[09 조서 마감·보존]]"}], "checks": [], "file": "법령/외부감사법 제19조.md", "id": "n8df89fb8", "links": ["n27412c45", "n9be1530c", "n21439867"], "grades": ["법률"], "backlinks": ["n27412c45", "n21439867", "n9be1530c"]}, {"title": "외부감사법 제20조", "type": "법령", "aliases": ["비밀엄수"], "status": "check", "verified": "", "sources": [{"label": "국가법령정보센터", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제20조"}], "intro": "비밀엄수 의무예요. 고객 자료를 다루는 모든 도구에 적용돼요.", "facts": [{"text": "감사인, 소속 공인회계사, 증선위 위원, 감사·감리를 보조·지원하는 자, 위탁받은 한공회 관련자는 직무상 알게 된 비밀을 누설하거나 부당한 목적으로 이용하면 안 됨", "src": "외부감사법 제20조", "grade": "법률"}, {"text": "위반은 3년 이하 징역 또는 3천만원 이하 벌금", "src": "외부감사법 제42조제5호", "grade": "법률"}], "sections": [{"name": "연결", "text": "\"감사 또는 감리 업무와 관련해 보조·지원하는 자\"(제20조제4호)에 도구 공급자가 해당하는지는 [[확인 필요 목록]]에 있어요."}], "checks": ["감사 도구 공급자가 제20조제4호의 '보조·지원하는 자'에 해당하는지", "고객 자료의 국외 클라우드 보관, 개인정보보호법상 수탁 여부"], "file": "법령/외부감사법 제20조.md", "id": "n6968dbb3", "links": ["n307ae253"], "grades": ["법률"], "backlinks": ["n959fa608"]}, {"title": "외부감사법 제21조", "type": "법령", "aliases": ["자료요구권"], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "국가법령정보센터", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제21조"}], "intro": "감사인이 회사에 자료를 요구할 수 있는 권한이에요.", "facts": [{"text": "감사인은 언제든지 회사와 관계회사의 회계 장부·서류를 열람·복사하고 자료 제출을 요구할 수 있음", "src": 센터", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제29조"}], "intro": "증권선물위원회가 회사와 감사인에게 내리는 행정 조치의 근거예요.", "facts": [{"text": "회사에 대해: 임원 해임·면직 권고, 6개월 이내 직무정지, 증권 발행제한, 시정요구 등", "src": "외부감사법 제29조①", "grade": "법률"}, {"text": "감사인에 대한 조치는 별표 1 사유에 따라 정함", "src": "외부감사법 제29조③", "grade": "법률"}, {"text": "공인회계사에 대한 조치 유형에 연간 20시간 이내 직무연수 부과, 직무정지 건의, 감사업무 제한 등이 있음", "src": "외부감사 및 회계 등에 관한 규정 제26조④", "grade": "시행령·규정"}], "sections": [{"name": "연결", "text": "[[제재 체계]], [[증권선물위원회]]"}], "checks": ["제29조③ 별표 1의 감사인 조치 목록 원문 정리"], "file": "법령/외부감사법 제29조.md", "id": "n6f129e3d", "links": ["ndd82f3f5", "n628f3fdb"], "grades": ["법률", "시행령·규정"], "backlinks": ["ndd82f3f5"]}, {"title": "외부감사법 제31조", "type": "법령", "aliases": ["손해배상책임"], "status": "check", "verified": "", "sources": [{"label": "국가법령정보센터", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제31조"}], "intro": "감사인의 민사 손해배상 책임이에요. 감사인이 조서를 꼼꼼히 남기는 가장 큰 이유예요.", "facts": [{"text": "임무를 게을리해 회사에 손해를 끼치면 회사에 배상", "src": "외부감사법 제31조①", "grade": "법률"}, {"text": "감사보고서에 중요 사항을 빠뜨리거나 거짓으로 적어 이를 믿은 제3자에게 손해를 끼치면 제3자에게 배상", "src": "외부감사법 제31조②", "grade": "법률"}, {"text": "감사인이 감사반이면 그 감사에 참여한 공인회계사가 연대 책임", "src": "외부감사법 제31조③", "grade": "법률"}, {"text": "회사 이사·감사도 책임이 있으면 연대 배상. 고의가 없으면 법원이 정한 귀책 비율만큼 배상", "src": "외부감사법 제31조④", "grade": "법률"}, {"text": "상장사 투자자에 대한 책임은 자본시장법 제170조가 이 조항을 준용", "src": "자본시장법 제170조", "grade": "법률"}], "sections": [], "checks": ["감사인이 \"임무를 게을리하지 않았음\"을 증명해야 하는 입증책임 조항(같은 조 후단 항)의 원문 문구"], "file": "법령/외부감사법 제31조.md", "id": "n5841f8d1", "links": [], "grades": ["법률"], "backlinks": ["n27412c45", "ndd82f3f5", "n766fa1d4"]}, {"title": "외부감사법 제41조", "type": "법령", "aliases": [], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "국가법령정보센터", "url": "https://www.law.go.kr/법령/주식회사등의외부감사에관한법률/제41조"}], "intro": "외부감사법에서 가장 무거운 벌칙 중 하나예요.", "facts": [{"text": "다음 행위는 5년 이하 징역 또는 5천만원 이하 벌금", "src": "외부감사법 제41조", "grade": "법률"}, {"text": "내부회계관리제도 회계정보의 위조·변조·훼손·파기", "src": "외부감사법 제41조제1호", "gra ": []}, {"title": "2026 품질관리기준 개정", "type": "기준·서식", "aliases": ["품질관리기준서 1", "품질관리기준서 2", "감사기준서 220"], "status": "kb", "verified": "", "sources": [{"label": "KICPA 공표 2026.8.6", "url": "https://www.kicpa.or.kr/board/read.brd?bltnNo=11786004332051&boardId=acc0102"}], "intro": "2026년에 공표된 품질관리기준 개정이에요. 회계법인 품질관리에 위험기반 접근법을 도입했어요.", "facts": [{"text": "회계감사기준위원회 의결 2026.3.6, 금융위 승인 2026.7.31, 한공회 공표 2026.8.6", "src": "KICPA 공표", "grade": "기준"}, {"text": "품질관리기준서 1(개정): 등록법인 2027.12.31까지, 그 외 법인·감사반 2029.12.31까지 설계·실행, 1년 내 평가", "src": "KICPA 공표", "grade": "기준"}, {"text": "품질관리기준서 2(제정)·감사기준서 220(개정): 등록법인 2027.12.31 이후 개시 보고기간 감사부터, 그 외 2029.12.31 이후", "src": "KICPA 공표", "grade": "기준"}, {"text": "업무품질검토자 요건과 업무수행이사 책임을 구체화", "src": "KICPA 공표", "grade": "기준"}], "sections": [{"name": "연결", "text": "발표일, 시행일, 적용 보고기간이 모두 달라요. 셋을 나눠 기록해야 해요. [[품질관리기준]], [[업무품질검토자]], [[업무수행이사]]"}], "checks": [], "file": "기준·서식/2026 품질관리기준 개정.md", "id": "n1c0aee58", "links": ["ndaa461fd", "ne2cc00c8", "n11a21f73"], "grades": ["기준"], "backlinks": ["ndaa461fd", "n9597cd9b", "n11a21f73", "ne2cc00c8", "n257d4dba"]}, {"title": "감사기준서 번호 체계", "type": "기준·서식", "aliases": ["ISA 번호", "기준서"], "status": "check", "verified": "", "sources": [{"label": "KICPA 회계감사기준", "url": "https://www.kicpa.or.kr/board/list.brd?boardId=acc0102"}], "intro": "한국 회계감사기준은 국제감사기준(ISA)과 같은 번호를 써요. 번호만 알면 해외 자료와 맞춰 볼 수 있어요.", "facts": [{"text": "200번대 총칙, 220 품질관리, 230 감사문서, 240 부정", "src": "지식베이스 v3.0", "grade": "기준"}, {"text": "300번대 계획(300), 위험평가(315), 중요성(320), 대응(330)", "src": "지식베이스 v3.0", "grade": "기준"}, {"text": "400번대 왜곡표시 평가(450)", "src": "지식베이스 v3.0", "grade": "기준"}, {"text": "500번대 감사증거(500), 재고(501), 외부조회(505), 분석적 절차(520), 표본(530), 후속사건(560), 계속기업(570)", "src": "지식베이스 v3.0", "grade": "기준"}, {"text": "700번대 보고: 의견(700·705), 핵심감사사항(701)", "src": "지식베이스 v3.0", "grade": "기준"}], "sections": [{"name": "연결", "text": "문단별 요구사항은 KICPA 원문으로 확인해야 해요. [[회계감사기준]]"}], "checks": ["각 기준서 번호와 제목을 KICPA 회계감사기준 전문(2026 개정)과 대조"], "file": "기준·서식/감사기준서 번호 체계.md", "id": "n34abf717", "links": ["n54e31fea"], "grades": ["기준"], "backlinks": ["n54e31fea"]}, {"title": "외부감사 실시내용", "type": "기준·서식", "aliases": ["실시내용", "별지 제4호"], "status": "verified", "verified": "2026-10-21", "sources": [{"label": "별지 제4호 PDF", "url": "https://www.law.go.kr/LSW/flDownload.do?flSeq=170474879"}, {"label": "시행세칙", "url": "https://www.law.go.kr/행정규칙/외부감사및회계등에관한규정시행세칙"}], "intro": "감사보고서에 붙이는 법정 서류예요. 누가 몇 시간 들였고 무엇을 했는지 적어요. 현행 서식은 금감원 시행세칙 별지 제4호(2026.10.7 시행)예요.", "facts": [{"text": "근거 체인: 외부감사법 제18조③ → 시행령 제25조 → 외부감사규정 제19조③ → 시행세칙 제3조④ 별지 제4호", "src": "외부감사법 · 시행령 · 규정 · 세칙", "grade": "시행령·규정"}, {"text": "1. 감사대상업무: 회사명, 감사대상 사업연도", "src": "시행세칙 별지 제4호", "grade": "시행령·규정"}, {"text": "2. 참여자 구분별 인원수와 감사시간(당기·전기): 품질관리검토자, 담당이사, 등록 공인회계사, 수습 공인회계사, 전산감사·세무·가치평가 전문가, 건설계약 등 수주산업 전문가", "src": "시행세칙 별지 제4호", "grade": "시행령·규정"}, {"text": "3. 주요 감사실시내용: 전반감사계획, 현장감사(회차별 시기·상주/비상주 인원), 재고·금융자산 실사, 외부조회, 지배기구 커뮤니케이션, 외부전문가 활용", "src": "시행세칙 별지 제4호", "grade": "시행령·규정"}, {"text": "4. 감사(감사위원회)와의 커뮤니케이션: 일자, 참석자, 방식, 주요 논의 내용", "src": "시행세칙 별지 제4호", "grade": "시행령·규정"}, {"text": "5. 중요성 금액 (일반 공개 시에만 선택 기재)", "src": "시행세칙 별지 제4호", "grade": "시행령·규정"}, {"text": "행정직원은 참여자에서 제외. 등록·수습 구분은 감사보고서일자 기준", "src": "시행세칙 별지 제4호 주석", "grade": "시행령·규정"}, {"text": "별도·연결 감사 투입 인원과 시간은 합산. 분·반기검토와 부수업무 시간 포함, 외국어 보고서 작성시간 제외", "src": "시행세칙 별지 제4호 주석", "grade": "시행령·규정"}, {"text": "현장감사 일수에서 공휴일 등 미수행일 제외. '상주'는 현장감사 전체 기간 상주한 경우만", "src": "시행세칙 별지 제4호 주석", "grade": "시행령·규정"}, {"text": "전기 감사인이 다르면 전기 수치는 전기 감사인 실시내용에서 가져오고 각주", "src": "시행세칙 별지 제4호 주석", "grade": "시행령·규정"}], "sections": [{"name": "연결", "text": "v3.0의 '기타 전문가' 한 칸은 현행 서식에서 두 칸으로 나뉘었어요. 시간 집계만으로는 서식을 채울 수 없고 실사·조회·회의 기록도 필요해요. [[외부감사법 제18조]], [[외부감사법 시행령 제25조]], [[감사팀 직급]], [[외부조회]], [[중요성]]"}], "checks": [], "file": "기준·서식/외부감사 실시내용.md", "id": "n4ca99f73", "links": ["naf0e303c", "n96a7db24", "n2cd11738", "n6bc1daae", "nf8a0aa08"], "grades": ["시행령·규정"], "backlinks": ["n6bc1daae /* inline markdown: escape → [[link]] → **bold** */
function inline(s){
  return esc(s).replace(/\[\[([^\]]+)\]\]/g,(m,t)=>{const id=W.names[t];return id?`<a class="l" data-go="${id}">${esc(t)}</a>`:`<span class="l miss" title="위키에 없는 노트">${esc(t)}</span>`})
               .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
}
function block(text){
  const out=[];let list=null;
  text.split("\n").forEach(line=>{
    const ul=line.match(/^- (.*)/), ol=line.match(/^\d+\. (.*)/);
    if(ul||ol){const tag=ul?"ul":"ol";if(!list||list.tag!==tag){list={tag,items:[]};out.push(list)}list.items.push((ul||ol)[1]);return}
    list=null; if(line.trim())out.push(`<p>${inline(line)}</p>`);

}

/* note view */
function graph(n){
  const ids=[...new Set([...n.links,...n.backlinks])].filter(i=>byId[i]&&i!==n.id).slice(0,10);
  if(!ids.length)return `<svg class="graph" viewBox="0 0 240 150" role="img" aria-label="연결 없음"><circle class="c" cx="120" cy="75" r="7"/></svg>`;
  const cx=120,cy=75,R=52;
  let lines="",nodes="",labels="";
  ids.forEach((id,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/ids.length, x=cx+R*1.15*Math.cos(a), y=cy+R*Math.sin(a);
    lines+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    nodes+=`<circle class="n" data-go="${id}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"><title>${esc(byId[id].title)}</title></circle>`;
    const t=byId[id].title, lab=t.length>7?t.slice(0,6)+"…":t, anchor=Math.cos(a)>0.3?"start":Math.cos(a)<-0.3?"end":"middle";
    const lx=x+(anchor==="start"?6:anchor==="end"?-6:0), ly=y+(Math.sin(a)>0.3?13:Math.sin(a)<-0.3?-7:3);
    labels+=`<text data-go="${id}" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}">${esc(lab)}</text>`;
  });
  return `<svg class="graph" viewBox="0 0 240 150" role="img" aria-label="연결된 노트">${lines}${nodes}<circle class="c" cx="${cx}" cy="${cy}" r="7"/>${labels}</svg>`;

  }else if(n===gapsNote){
    h+=`<p>채팅에서 "위키에 없음"으로 답한 질문이 여기에 쌓여요. Claude Code에게 "빈칸 목록 채워줘"라고 하면 원문을 찾아 노트를 만들고 위키를 다시 게시해요.</p>`;
    h+=gaps.length?gaps.map(g=>`<div class="gaprow"><b>${esc(g.question)}</b>${g.gap?`<span>${esc(g.gap)}</span>`:""}<span>${new Date(g.at).toLocaleString("ko-KR")}</span></div>`).join("")
       :`<p class="thinking">${dbState==="off"?"이 화면에서는 빈칸 목록을 불러올 수 없어요. claude.ai나 로컬 서버(serve.py)에서 열면 보여요.":"아직 쌓인 질문이 없어요."}</p>`;
  }else{
    if(n.intro)h+=block(n.intro);
    if(n.facts.length){
      h+=`<h2>사실</h2><div class="facts"><div class="fhead"><span>내용</span><span>근거</span><span>등급</span></div>`+n.facts.map(f=>`<div class="fact"><span>${inline(f.text)}</span><span class="fsrc">${esc(f.src)}</span><span>${badge(f.grade)}</span></div>`).join("")+`</div>`;
    }
    n.sections.forEach(s=>{h+=`<h2>${esc(s.name)}</h2>${block(s.text)}`});
    if(n.checks.length)h+=`<h2>확인 필요</h2><ul class="checks">${n.checks.map(c=>`<li>${inline(c)}</li>`).join("")}</ul>`;
    if(n.sources.length)h+=`<h2>출처</h2><div class="srcs">${n.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join("")}</div>`;
  }
  h+=`</div>`;
  if(n.status!=="virtual"){
    h+=`<div class="foot"><div><h3>이 노트를 가리키는 노트 · ${n.backlinks.length}</h3><div class="chips">${n.backlinks.map(b=>`<button class="chip" data-go="${b}">${esc(byId[b].title)}</button>`).join("")||`<span class="thinking" style="font-size:13px">아직 없어요</span>`}</div></div><div><h3>연결</h3>${graph(n)}</div></div>`;
  }
  el.innerHTML=h;
  document.getElementById("main").scrollTop=0;
}
function go(id,push=true){
  if(!byId[id])return; current=id; renderNote(); renderTree();
  store.set("wiki-last",id);
  if(push){try{history.replaceState(null,"","#"+id)}catch(e){}}
  setPane("note");
}

/* panes (narrow) */
const app=document.getElementById("app");
function setPane(p){app.dataset.pane=p;document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.pane===p))}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setPane(b.dataset.pane));

/* events */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){e.preventDefault();go(g.dataset.go);return}
  const f=e.target.closest(".fchip"); if(f){filter=f.dataset.f;renderFilters();renderTree();return}
});
document.getElementById("gapbtn").onclick=()=>go(gapsNote.id);
const qEl=document.getElementById("q");
qEl.addEventListener("input",()=>{query=qEl.value.trim();renderTree()});
qEl.addEventListener("keydown",e=>{if(e.key==="Enter"){const first=document.querySelector(".tree .it");if(first)go(first.dataset.go)}});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();setPane("list");qEl.focus()}});

/* 로컬 실행(serve.py): claude.ai 기능 대신 로컬 API를 쓴다 */
const LOCAL=!window.claude&&/^https?:$/.test(location.protocol)?fetch("/api/health").then(r=>r.ok?r.json():null).catch(()=>null):Promise.resolve(null);
const localSample=async(conv)=>{
  const prompt=conv.map(t=>(t.role==="user"?"[사용자]\n":"[도우미]\n")+t.content).join("\n\n")+"\n\n위 대화에서 마지막 [사용자] 질문에 [도우미]로서 답해. 답만 출력해.";
  const r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw {code:j.code||"upstream_error",message:j.message||""};
  return {text:j.text||""};
};
const localDb={collection:()=>({
  where:()=>({onSnapshot:(next,err)=>{
    const load=()=>fetch("/api/gaps").then(r=>r.json()).then(list=>next({docs:list.map((g,i)=>({id:String(i),data:()=>g}))})).catch(()=>err&&err());
    load(); localDb._reload=load; return ()=>{};
  }}),
  add:async d=>{const r=await fetch("/api/gaps",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});if(!r.ok)throw new Error("save");localDb._reload&&localDb._reload();return {}}
})};

/* gaps (db) */
let db=null, dbState="loading";
const gapcnt=document.getElementById("gapcnt");
function renderGapCount(){gapcnt.textContent=dbState==="off"?"—":`${gaps.length}건`}
(async()=>{
  const local=await LOCAL;
  if(local)db=localDb;
  else{try{db=await window.claude?.use?.("db")}catch(e){db=null}}
  if(!db){dbState="off";renderGapCount();if(current===gapsNote.id)renderNote();return}
  dbState="on";
  db.collection("gaps").where("status","==","open").onSnapshot(s=>{
    gaps=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);
    renderGapCount();renderTree();if(current===gapsNote.id)renderNote();
  },()=>{dbState="off";renderGapCount()});
})();
async function addGap(question,gap){
  if(!db)return false;
  try{await db.collection("gaps").add({question,gap:gap||"",at:Date.now(),status:"open"});return true}catch(e){return false}
}

/* chat */
const msgs=document.getElementById("msgs"), input=document.getElementById("input"), send=document.getElementById("send");
let sample=null, turns=[], busy=false;
const CONTEXT=(()=>{
  return real.map(n=>{
    let s=`### ${n.title}`+(n.aliases.length?` (다른 이름: ${n.aliases.join(", ")})`:"")+`\n`;
    if(n.intro)s+=n.intro+"\n";
    n.facts.forEach(f=>{s+=`- ${f.text} [${f.src} · ${f.grade}]\n`});
    n.sections.forEach(x=>{s+=x.text+"\n"});
    n.checks.forEach(c=>{s+=`- (확인 필요) ${c}\n`});
    return s}).join("\n");
})();
const RULES=`너는 회계감사 공부를 돕는 위키 도우미야. 아래 <wiki>에 있는 내용만 근거로 한국어로 답해.
규칙:
- 위키에 있는 사실만 말하고, 근거가 된 노트 제목을 [[노트 제목]] 형식으로 문장 안에 달아. 노트 제목은 위키에 있는 것만 써.
- 법 조문, 기준서 번호, 숫자는 위키에 적힌 그대로만 써. 위키에 없는 조문이나 수치를 만들지 마.
- 등급이 '관행'이나 '확인 필요'인 내용은 그렇다고 밝혀.
- 3~6문장으로 짧게, 해요체로 답해. 목록이 필요하면 "- "로 시작하는 줄을 써.
- 질문의 핵심에 답할 근거가 위키에 없으면, 아는 범위만 말하고 마지막 줄에 정확히 "GAP: (위키에 없는 내용 한 줄 요약)"을 써. 근거가 충분하면 GAP 줄을 쓰지 마.
- 일반 상식으로 위키의 빈자리를 채우지 마.

<wiki>
${CONTEXT}
</wiki>`;
function botHTML(text){return block(text.replace(/\n{2,}/g,"\n"))}
function add(cls,html){const d=document.createElement("div");d.className=cls;d.innerHTML=html;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
function intro(){
  msgs.innerHTML="";
  const s=add("sugg",`<p>이런 걸 물어볼 수 있어요</p>`);
  ["감사반은 어떤 회사를 감사할 수 없어?","조서를 SaaS에 저장해도 법적으로 괜찮아?","정기총회 날짜에서 감사 기한은 어떻게 계산해?","회계처리기준과 회계감사기준은 뭐가 달라?"].forEach(q=>{
    const b=document.createElement("button");b.type="button";b.textContent=q;b.onclick=()=>{input.value=q;ask()};s.appendChild(b)});
}
const ERR={not_granted:"이 페이지에서 Claude 사용이 허용되지 않았어요.",sampling_disabled:"이 계정에서는 Claude를 쓸 수 없어요.",rate_limited:"요청이 많아요. 잠시 뒤 다시 보내 주세요.",session_expired:"claude.ai에 다시 로그인해 주세요.",refused:"이 질문에는 답할 수 없어요. 다르게 물어봐 주세요.",prompt_too_large:"대화가 길어졌어요. 새로고침 후 다시 물어봐 주세요."};
async function ask(){
  const q=input.value.trim(); if(!q||busy)return;
  if(!sample){add("bot err","이 화면에서는 질문 기능을 쓸 수 없어요. claude.ai에서 열어 주세요.");return}
  if(msgs.querySelector(".sugg"))msgs.innerHTML="";
  busy=true; send.disabled=true; input.value=""; input.style.height="";
  add("me",esc(q));
  const box=add("bot",`<span class="thinking">위키를 찾아보는 중…</span>`);
  const hist=turns.slice(-6);
  const first=hist.length?hist[0]:null;
  const conv=[...hist,{role:"user",content:q}];
  conv[0]={role:"user",content:RULES+"\n\n질문: "+(first?first.content:q)};
  try{
    const {text}=await sample(conv,{cache:false,onText:({text})=>{box.innerHTML=botHTML(text.replace(/\n?GAP:.*$/s,""))}});
    const m=text.match(/\n?GAP:\s*(.+)\s*$/);
    const answer=text.replace(/\n?GAP:.*$/s,"").trim();
    if(m){
      box.className="bot missbox";
      const saved=await addGap(q,m[1].trim());
      box.innerHTML=`<span class="tag">위키에 없음${saved?" · 빈칸 목록에 추가했어요":""}</span>`+botHTML(answer||m[1]);
    }else box.innerHTML=botHTML(answer);
    turns.push({role:"user",content:q},{role:"assistant",content:text});
  }catch(e){
    if(e&&e.code==="cancelled"){box.remove()}
    else{box.className="bot err";box.textContent=ERR[e?.code]||"답을 받지 못했어요. 다시 보내 주세요.";if(e?.code==="not_granted"||e?.code==="sampling_disabled")sample=null}
  }
  busy=false; send.disabled=false; msgs.scrollTop=msgs.scrollHeight;
}
document.getElementById("ask").addEventListener("submit",e=>{e.preventDefault();ask()});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask()}});
input.addEventListener("input",()=>{input.style.height="";input.style.height=Math.min(input.scrollHeight,120)+"px"});
intro();
(async()=>{
  const local=await LOCAL;
  if(local&&local.claude)sample=localSample;
  else if(!local){try{sample=await window.claude?.use?.("sample")}catch(e){sample=null}}
  if(!sample){document.querySelector(".chat .hint").textContent=local?"claude CLI가 없어 질문 기능이 꺼져 있어요.":"질문 기능은 claude.ai나 로컬 서버(serve.py)에서 열었을 때 동작해요."}
})();

/* start */
renderFilters();
const start=(location.hash&&byId[location.hash.slice(1)])?location.hash.slice(1):(store.get("wiki-last",null)&&byId[store.get("wiki-last",null)]?store.get("wiki-last",null):W.notes.find(n=>n.title==="시작하기").id);
go(start,false); setPane("note");
})();
</script>
