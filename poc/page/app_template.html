<title>K-Tieout 감사 워크스페이스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 밝은 화면 하나로 고정 */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --panel:#FAFAFB; --head:#F7F8FA; --line:#E4E6EA; --line-2:#ECEEF1;
  --ink:#1C2230; --ink-2:#3D4554; --muted:#6E7684; --faint:#F7F8FA; --gray-soft:#EFF1F4;
  --brand:#1F4FA8; --brand-soft:#EEF2FA; --brand-2:#B9C8E6; --folder:#1E4E9E;
  --amber:#D9822B; --amber-soft:#FFF6EC; --amber-line:#F4C48E;
  --green:#3C9A5F; --green-soft:#EDF7F0; --green-line:#B8DEC5;
  --red:#C8443A; --red-soft:#FCEEEC; --red-line:#EFC0BB;
  --f-ui:"Inter","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
/* 레이아웃: 옅은 회색 아이콘 레일 | 흰 탭바 + 본문. 조서·검토·자료 화면은 좌측 회색 패널 + 우측 흰 시트가 화면 끝까지 */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.app{height:100%;display:grid;grid-template-columns:76px minmax(0,1fr)}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:18px;
  position:sticky;top:0;height:100vh;padding-left:env(safe-area-inset-left,0px)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--folder);display:grid;place-items:center;margin-bottom:22px;cursor:pointer}
.logo svg{width:19px;height:19px}
#railnav{display:grid;gap:10px}
.rail button{width:42px;height:42px;border:0;background:transparent;border-radius:8px;color:#4A5160;display:grid;place-items:center;cursor:pointer;position:relative}
.rail button svg{width:22px;height:22px}
.rail button:hover{background:var(--gray-soft)}
.rail button[aria-current="page"]{background:var(--gray-soft);color:var(--ink)}
.rail button .tip{position:absolute;left:52px;white-space:nowrap;background:var(--ink);color:#fff;font-size:12px;padding:3px 8px;border-radius:4px;opacity:0;pointer-events:none;z-index:7}
.rail button:hover .tip,.rail button:focus-visible .tip{opacity:1}
.shell{min-width:0;display:flex;flex-direction:column;height:100vh}
.top{background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;min-height:72px;flex:none;
  padding-block:10px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.tabs{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1 1 auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:10px 18px;border-radius:8px;color:#5B6372;cursor:pointer;white-space:nowrap;font-size:17px;letter-spacing:.01em}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{background:var(--gray-soft);color:var(--ink)}
.tabs .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:8px;border-radius:10px;background:var(--gray-soft);color:var(--muted);font-size:12px;line-height:20px;text-align:center;vertical-align:2px}
.tabs button[aria-current="page"] .cnt{background:#fff}
.ctx{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:17px}
.ctx b{font-weight:500}
.ctx .ico{width:20px;height:20px;color:#4A5160}
main{flex:1;overflow:auto;min-width:0;padding-block:28px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:22px;align-content:start}
main.flush{padding:0;display:block;overflow:hidden}

/* 화면 설명: 탭바 오른쪽 버튼, 누르면 아래로 펼침 */
.help{position:relative;font-size:14px;color:var(--ink-2)}
.help summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;font-weight:500;color:var(--ink-2)}
.help summary::-webkit-details-marker{display:none}
.help summary svg{width:16px;height:16px}
.help[open] summary{background:var(--gray-soft)}
.help > div{position:absolute;right:0;top:calc(100% + 8px);width:min(420px,calc(100vw - 32px));padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:10px;line-height:1.65;box-shadow:0 8px 24px rgba(20,30,50,.12);z-index:30}
.help b{font-weight:600;color:var(--ink)}

h1{font-size:28px;font-weight:400;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;letter-spacing:-.01em}
h1 .sub{color:var(--muted);font-weight:400}
h2{font-size:17px;font-weight:500;margin:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--green)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2)}
.btn svg{width:17px;height:17px}
.btn:hover{background:var(--faint)}
.btn.primary{background:var(--folder);border-color:var(--folder);color:#fff}
.btn.icon{padding:8px 10px}
.btn:focus-visible,.tabs button:focus-visible,.rail button:focus-visible,.seg button:focus-visible,.list-item:focus-visible,tr.click:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,.help summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}

/* 카드: 흰 판 + 얇은 선 */
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 22px;min-width:0}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.card-head h2{font-weight:400;font-size:17px;margin-right:auto}
.card-head > span.muted{font-size:13px}
.card-head::after{content:"···";color:#9AA1AD;letter-spacing:1px;font-weight:700;margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.kpi .v{font-size:44px;font-weight:300;line-height:1.1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px;letter-spacing:-.02em}
.kpi .v small{font-size:14px;color:var(--muted);letter-spacing:0;font-weight:400}
.kpi .s{font-size:13px;color:var(--muted);margin-top:10px}
.segbar{display:flex;gap:4px;height:9px;margin-top:18px}
.segbar span{border-radius:5px;min-width:3px}
.grid3{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}

/* 상태 표시 */
.pill{display:inline-block;font-size:13px;font-weight:500;border-radius:6px;padding:3px 10px;white-space:nowrap;border:1px solid transparent;line-height:1.35}
.p-pend{color:var(--amber);background:var(--amber-soft);border-color:var(--amber-line)}
.p-prog{color:var(--brand);background:var(--brand-soft);border-color:var(--brand-2)}
.p-done{color:var(--green);background:var(--green-soft);border-color:var(--green-line)}
.p-arch{color:var(--muted);background:var(--faint);border-color:var(--line)}
.p-red{color:var(--red);background:var(--red-soft);border-color:var(--red-line)}
.tag{display:inline-block;font-size:12px;border-radius:5px;padding:1px 7px;background:var(--gray-soft);color:var(--muted);white-space:nowrap}
.cntbar{display:flex;gap:4px;min-width:130px}
.cntbar span{display:inline-block;border-radius:10px;color:#fff;font-size:11.5px;font-weight:500;line-height:20px;text-align:center;padding:0 7px;min-width:24px}
.avatar{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gray-soft);color:var(--ink-2);font-size:11px;font-weight:600;margin-right:8px;vertical-align:middle}

/* 표: 머리글 옅은 회색, 칸마다 선 */
.tbl{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:13px 16px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:middle}
th:last-child,td:last-child{border-right:0}
th{font-size:14.5px;font-weight:500;color:var(--ink);white-space:nowrap;background:var(--head);position:sticky;top:0;z-index:1}
td{font-size:15px;color:var(--ink-2)}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--faint)}
tr.sel td{background:var(--gray-soft)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}
td.ck,th.ck{width:52px;min-width:52px;text-align:center;padding:0}
.cb{display:inline-block;width:18px;height:18px;border:1.5px solid #9AA1AD;border-radius:4px;vertical-align:middle;background:#fff}
.colh{display:flex;align-items:center;justify-content:space-between;gap:16px}
.colh i{font-style:normal;color:#5B6372;font-weight:700;font-size:16px;line-height:1}

/* 목록 화면 */
.listpage{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.listpage th,.listpage td{padding:12px 13px}
.filters{display:grid;gap:16px;align-content:start}
.filters .lbl{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.filters label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
select,textarea{font:inherit;font-size:14.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}

/* 분할 화면: 왼쪽 회색 패널, 오른쪽 흰 본문, 화면 높이 꽉 채움 */
.split{display:grid;grid-template-columns:400px minmax(0,1fr);height:100%;min-height:0}
.split > .pane{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.split > .pane:first-child{background:var(--panel);border-right:1px solid var(--line)}
.split > .pane:last-child{background:#fff}
.pane-head{padding:16px 22px;display:flex;align-items:center;gap:12px;min-height:76px;flex:none;flex-wrap:wrap}
.pane-head h2{font-size:19px;font-weight:500}
.pane-head .ico{width:20px;height:20px;color:#4A5160}
.pane-head .ibtn{border:1px solid transparent;background:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:#4A5160}
.pane-head .ibtn.box{border-color:var(--line);background:#fff}
.pane-head .ibtn svg{width:19px;height:19px}
.pane-body{flex:1;overflow:auto;min-height:0}
.pad{padding:0 22px 22px}
.search{margin:0 22px 14px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:#5B6372;background:#fff;font-size:16px}
.search svg{width:18px;height:18px;flex:none}
.search input{border:0;outline:0;background:transparent;font:inherit;color:var(--ink);width:100%}
.tree{padding:0 14px 20px;display:grid;gap:0;flex:1;overflow:auto;align-content:start}
.tree .folder{display:flex;align-items:center;gap:10px;padding:10px 8px;font-size:16.5px;color:var(--ink-2)}
.tree .folder .chev{color:#5B6372;width:14px;text-align:center;font-size:15px}
.tree .folder svg.f{width:21px;height:21px;color:var(--folder);fill:var(--folder)}
.tree .folder .st{width:14px;height:14px}
.tree .folder .n{margin-left:auto;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.list-item{display:flex;align-items:center;gap:9px;padding:9px 8px 9px 40px;border-radius:8px;border:0;background:none;width:100%;text-align:left;cursor:pointer;font-size:15px;color:var(--ink-2)}
.list-item:hover{background:var(--gray-soft)}
.list-item[aria-current="true"]{background:#E9ECEF}
.list-item .st{width:13px;height:13px;flex:none}
.list-item .doc{width:16px;height:16px;flex:none;color:#4A5160}
.list-item .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .n{margin-left:auto;font-size:13.5px;color:var(--muted);padding-left:8px}
.seg{display:inline-flex;gap:8px}
.seg button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--ink-2);font-weight:500;display:inline-flex;align-items:center;gap:8px}
.seg button svg{width:17px;height:17px}
.seg button[aria-pressed="true"]{background:var(--gray-soft);color:var(--ink);border-color:#D5D9DF}
.explain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;font-size:14px;color:var(--ink-2)}
.explain div{border-left:2px solid var(--line);padding:0 14px}
.explain .k{font-size:12.5px;color:var(--muted);display:block;margin-bottom:3px}

/* 시트 */
.sheet{flex:1;overflow:auto;min-height:0;border-top:1px solid var(--line)}
.sheet table{font-size:15px}
.sheet td{padding:12px 16px;white-space:nowrap;border-bottom:1px solid var(--line);border-right:1px solid var(--line);color:var(--ink)}
.sheet td.n{text-align:right;font-variant-numeric:tabular-nums}
.sheet td.ck{position:sticky;left:0;background:#fff;z-index:1}
.sheet td.dh{width:40px;text-align:center;color:#A3A9B3;padding:0;border-right:0;font-size:14px;letter-spacing:-2px}
.sheet tr.k-h td{background:var(--head);font-weight:500;position:sticky;top:0;z-index:2;font-size:14.5px}
.sheet tr.k-h td.ck{z-index:3;background:var(--head)}
.sheet tr.k-f td.ck{box-shadow:inset 3px 0 0 var(--red)}
.sheet tr.k-w td.ck{box-shadow:inset 3px 0 0 var(--amber)}
.sheet tr.k-b td{font-weight:500}
.sheet tr.k-t td{font-weight:600}
.sheet tr.blank td{height:14px;padding:0}
.sheet td.long{white-space:normal;min-width:300px;max-width:560px}
.signoff{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* 검토 화면 */
.ex-list{display:grid;align-content:start;overflow:auto;flex:1;padding:0 14px 20px}
.ex-item{display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:12px;padding:12px 12px 12px 0;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;width:100%}
.ex-item:hover{background:var(--gray-soft)}
.ex-item[aria-current="true"]{background:#E9ECEF}
.ex-item .sev{border-radius:2px}
.ex-item .t{font-weight:500;font-size:15.5px;color:var(--ink)}
.ex-item .s{font-size:13px;color:var(--muted)}
.ex-item .amt{font-size:14px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.ev3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ev{border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0}
.ev.miss{border-style:dashed;background:var(--faint)}
.ev.bad{border-color:#C9D0DA}
.ev h3{margin:0;font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px;color:var(--muted)}
.ev h3 svg{width:17px;height:17px}
.ev dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:14px}
.ev dt{color:var(--muted)}
.ev dd{margin:0;overflow-wrap:anywhere}
.ev .big{font-size:26px;font-weight:300;font-variant-numeric:tabular-nums}
.ev .none{color:var(--muted)}
.ev .none::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:2px}
.decide{display:flex;gap:8px;flex-wrap:wrap}
.decide .btn[aria-pressed="true"]{background:var(--gray-soft);color:var(--ink);border-color:#C9D0DA}
.plain{font-size:17px;line-height:1.6;color:var(--ink)}
.note{background:var(--faint);border:1px solid var(--line-2);border-radius:10px;padding:16px 18px;font-size:14.5px}

/* 차트 */
.donut{display:grid;grid-template-columns:160px minmax(0,1fr);gap:20px;align-items:center}
.donut svg{width:160px;height:160px}
.lg{display:grid;gap:12px;font-size:14.5px}
.lg div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center}
.lg i{width:10px;height:10px;border-radius:50%}
.hbar{display:grid;gap:16px}
.hbar .r{display:grid;grid-template-columns:100px minmax(0,1fr) 58px;gap:12px;align-items:center;font-size:14.5px}
.hbar .t{height:9px;background:var(--gray-soft);border-radius:5px;overflow:hidden}
.hbar .t span{display:block;height:100%;border-radius:5px}
.vat .r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 110px;gap:12px;align-items:center;font-size:14px;padding:5px 0}
.vat .tr{position:relative;height:10px}
.vat .ax{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.vat .sg{position:absolute;top:1px;height:8px;border-radius:4px}
.todo{display:grid}
.todo button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 0;text-align:left;cursor:pointer;font-size:15px}
.todo button:last-child{border-bottom:0}
.todo button:hover .t{color:var(--brand)}
.big-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.big-compare .card{display:grid;gap:10px}
.big-compare .n{font-size:52px;font-weight:300;line-height:1.1;font-variant-numeric:tabular-nums}
.dots11{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.dots11 i{width:20px;height:20px;border-radius:5px;background:var(--gray-soft)}
.dots11 i.on{background:var(--folder)}
.dots11 i.half{background:var(--brand-2)}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:1200px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .grid3 > :first-child{grid-column:1/-1}
  .split{grid-template-columns:320px minmax(0,1fr)}
  .ev3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .shell{height:auto;min-height:100vh}
  main.flush{overflow:visible}
  .split{grid-template-columns:minmax(0,1fr);height:auto}
  .split > .pane:first-child{border-right:0;border-bottom:1px solid var(--line);max-height:380px}
  .sheet{max-height:70vh}
  .listpage,.grid2,.grid3,.big-compare{grid-template-columns:minmax(0,1fr)}
  .grid3 > :first-child{grid-column:auto}
  .explain{grid-template-columns:minmax(0,1fr)}
  .tabs button{font-size:15px;padding:8px 12px}
  .ctx{font-size:15px}
  .donut{grid-template-columns:120px minmax(0,1fr)}
  .donut svg{width:120px;height:120px}
}
@media (max-width:480px){.kpis{grid-template-columns:minmax(0,1fr)}}
</style>

<div class="app" id="app">
  <aside class="rail" aria-label="주 메뉴">
    <div class="logo" title="K-Tieout 감사 목록으로" id="logoHome" role="button" tabindex="0" style="cursor:pointer"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div>
    <div id="railnav"></div>
  </aside>
  <div class="shell">
    <header class="top" id="top"></header>

    </div>`;
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));

  document.querySelectorAll("[data-wp]").forEach(b => b.onclick = () => { state.wp = b.dataset.wp; vWp(); });
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { state.mode = b.dataset.m; vWp(); });
  const qi = $("#wpq"); qi.oninput = () => { state.q = qi.value; vWp(); const n = $("#wpq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
}

// ------------------------------------------------------------ 검토 필요
const RISKC = r => r.includes("높음") ? "var(--red)" : "var(--line)";
const DEC = [["ok", "이상 없음 확인"], ["fix", "회사에 수정 요청"], ["more", "추가 절차 필요"]];
const DECL = {ok:"확인 완료", fix:"수정 요청", more:"추가 절차"};
function vReview(){
  const list = EX.filter(x => state.exFilter === "all" || (state.exFilter === "open" ? !decisions[x.no]?.d : decisions[x.no]?.d));
  const x = EX.find(e => e.no === state.ex) || list[0] || EX[0];
  const ev = D.evidence[x.no] || {};
  const dec = decisions[x.no] || {};
  const L = ev.ledger, V = ev.invoice, B = ev.deposits || [];
  const k = x.kind;
  const missL = !L || k.startsWith("세금계산서O"), missV = !V || k.startsWith("원장O"), missB = !B.length;
  const amtBad = k === "금액 불일치", dateBad = k.startsWith("기간귀속");
  const evCard = (title, icon, miss, bad, body) => `<div class="ev ${miss ? "miss" : bad ? "bad" : ""}"><h3>${svg(icon)}${title}</h3>${miss ? '<p class="none">기록 없음</p>' : body}</div>`;
  $("#view").innerHTML = `
    ${hint(`<b>이 화면</b>은 K-Tieout이 "사람이 직접 봐야 한다"고 골라낸 거래입니다. 가운데에 <b>회사 장부 · 세금계산서(국세청) · 은행 입금</b> 세 기록이 나란히 나옵니다. 빨간 칸이 빠진 기록입니다. 확인한 뒤 아래 버튼으로 판단을 남기세요(이 브라우저에만 저장).`)}
    <div class="split">
      <div class="pane">
        <div class="pane-head">${svg("review", 'class="ico"')}<h2>검토 필요</h2><span class="muted">(${EX.length})</span></div>
        <div style="padding:0 22px 12px"><div class="seg" role="group" aria-label="처리 상태">${[["open","미처리 " + openCount()],["done","처리 " + (EX.length - openCount())],["all","전체"]].map(([v, l]) => `<button data-f="${v}" aria-pressed="${state.exFilter === v}">${l}</button>`).join("")}</div></div>
        <div class="ex-list">${list.map(e => `<button class="ex-item" data-ex="${e.no}" aria-current="${e.no === x.no}">
        <span class="sev" style="background:${RISKC(e.risk)}"></span>
        <span style="min-width:0"><span class="t">${short(e.kind)}</span><br><span class="s">${esc(e.cust_name)} · <span class="mono">${e.no}</span>${decisions[e.no]?.d ? ` · <b style="color:var(--brand);font-weight:500">${DECL[decisions[e.no].d]}</b>` : ""}</span></span>
        <span class="amt">${won(e.amount)}</span></button>`).join("") || '<p class="muted" style="padding:14px">해당 항목이 없습니다.</p>'}</div></div>
      <div class="pane">
        <div class="pane-head" style="border-bottom:1px solid var(--line)"><span class="mono muted">${x.no}</span><h2>${short(x.kind)} · ${esc(x.cust_name)}</h2><span class="spacer"></span>
          <span class="pill ${x.risk.includes("높음") ? "p-red" : "p-arch"}">위험 ${x.risk}</span><span class="pill p-arch">${x.assertion}</span></div>
        <div class="pane-body" style="padding:22px;display:grid;gap:18px;align-content:start">
          <p class="plain">${plain(k)}</p>
          <div class="ev3">
            ${evCard("회사 장부", "book", missL, amtBad || dateBad, L ? `<div class="big">${won(L.total)}원</div><dl><dt>전표일</dt><dd class="num" style="${dateBad ? "color:var(--brand);font-weight:500" : ""}">${L.date}</dd><dt>전표번호</dt><dd class="mono">${L.no}</dd><dt>거래처</dt><dd>${esc(L.cust)}</dd><dt>적요</dt><dd>${esc(L.memo)}</dd></dl>` : "")}
            ${evCard("세금계산서 (국세청)", "receipt", missV, amtBad || dateBad || (V && V.total < 0), V ? `<div class="big">${won(V.total)}원</div><dl><dt>작성일</dt><dd class="num" style="${dateBad ? "color:var(--brand);font-weight:500" : ""}">${V.wdate}</dd><dt>종류</dt><dd>${esc(V.kind)}</dd><dt>공급받는자</dt><dd>${esc(V.name)}<br><span class="mono muted">${V.bizno}</span></dd><dt>승인번호</dt><dd class="mono" style="font-size:11px">${V.appr}</dd>${V.orig ? `<dt>당초 발행</dt><dd>${V.orig.wdate} · ${won(V.orig.total)}원</dd>` : ""}</dl>` : "")}
            ${evCard("은행 입금", "bank", missB, k.startsWith("제3자"), B.length ? `<div class="big">${won(B.reduce((s, b) => s + b.amount, 0))}원</div><dl>${B.map(b => `<dt class="num">${b.dt.slice(0, 10)}</dt><dd>${won(b.amount)}원 · 입금자 <b style="font-weight:500">${esc(b.memo)}</b></dd>`).join("")}</dl>` : "")}
          </div>
          <div class="note"><span class="muted" style="font-size:12px">K-Tieout이 찾은 근거</span><p style="margin:2px 0 8px">${esc(x.detail)}</p><span class="muted" style="font-size:12px">권고 확인 절차</span><p style="margin:2px 0 0">${esc(x.action)}</p></div>
          <div style="display:grid;gap:8px"><h2>회계사 판단</h2>
            <div class="decide">${DEC.map(([v, l]) => `<button class="btn" data-d="${v}" aria-pressed="${dec.d === v}">${l}</button>`).join("")}</div>
            <label for="memo-${x.no}" class="muted" style="font-size:12px">메모</label>
            <textarea id="memo-${x.no}" rows="2" placeholder="예: 회사 담당자에게 출고증 요청 (2/18)">${esc(dec.m || "")}</textarea>
            <div class="row"><span class="muted" style="font-size:12px">K-Tieout은 판단하지 않습니다. 결론과 수정 요구는 회계사가 정합니다.</span><span class="spacer"></span><button class="btn" id="nextEx">다음 항목 →</button></div>
          </div>
        </div>
      </div>
    </div>`;
  document.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { state.ex = b.dataset.ex; vReview(); });
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { state.exFilter = b.dataset.f; vReview(); });
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
    const cur = decisions[x.no] || {};
    decisions[x.no] = {...cur, d: cur.d === b.dataset.d ? null : b.dataset.d};
    store.set("kt-decisions", decisions); toast(decisions[x.no].d ? `${x.no}: ${DECL[decisions[x.no].d]}로 표시했습니다.` : `${x.no}: 판단을 지웠습니다.`);
    renderTop(); vReview();
  });
  const memo = document.getElementById(`memo-${x.no}`);
  memo.oninput = () => { decisions[x.no] = {...(decisions[x.no] || {}), m: memo.value}; store.set("kt-decisions", decisions); };
  $("#nextEx").onclick = () => { const i = EX.findIndex(e => e.no === x.no); state.ex = EX[(i + 1) % EX.length].no; vReview(); };
}

// ------------------------------------------------------------ 비교 리포트
const ANOM_PLAIN = {
  A1:"장부에만 있는 매출 (세금계산서·입금 없음)", A2:"세금계산서 없이 판 매출", A3:"장부에서 빠진 매출", A4:"금액을 잘못 입력",
  A5:"반품을 장부에 반영 안 함", A6:"내년 매출을 올해로 앞당김", A7:"올해 매출을 내년으로 미룸", A8:"연말 큰 매출이 1월에 전부 반품",
  A9:"다른 사람 이름으로 들어온 대금", A10:"같은 매출을 두 번 기록", A11:"오래 못 받은 돈",
};
const RES = {"발견":["p-done","찾음"],"발견 가능":["p-done","찾을 수 있음"],"징후":["p-pend","이상하다는 것만"],"미발견":["p-red","못 찾음"]};
function vReport(){
  const A = D.anomalies, asisF = D.asis_counts["발견"] + D.asis_counts["발견 가능"];
  const items = D.vat.items, vtot = D.asis_vat_diff;
  const pos = items.reduce((s, x) => s + Math.max(0, x.v), 0), neg = items.reduce((s, x) => s + Math.min(0, x.v), 0);
  const ext = Math.abs(neg) + Math.max(pos, vtot), zero = 100 * Math.abs(neg) / ext, sc = v => 100 * Math.abs(v) / ext;
  $("#view").innerHTML = `
    ${hint(`<b>한 줄 요약:</b> 회계사가 일부(25건)만 보던 것을, 컴퓨터가 전부(${C.pop_n}건) 맞춰 보고 이상한 것만 골라줍니다. 아래 숫자는 <b>가짜 데이터</b>에 문제 11개를 숨겨 두고 채점한 결과입니다.`)}
    <h1>비교 리포트 <span class="sub">지금 방식 vs K-Tieout</span></h1>
    <div class="big-compare">
      <div class="card"><span class="muted">지금 방식 · 매출 ${C.pop_n}건 중 ${AC.vouch_n}건 확인</span><span class="n">${asisF}<span style="font-size:18px" class="muted"> / 11 찾음</span></span>
        <div class="dots11">${A.map(a => `<i class="${["발견","발견 가능"].includes(a.asis) ? "on" : a.asis === "징후" ? "half" : ""}" title="${a.id}"></i>`).join("")}</div>
        <span class="muted" style="font-size:12.5px">노란 칸 ${D.asis_counts["징후"]}개는 "숫자가 안 맞는다"까지만 알고 이유는 모름</span></div>
      <div class="card"><span class="muted">K-Tieout · 매출 ${C.pop_n}건 전부 확인</span><span class="n" style="color:var(--brand)">${D.tobe_counts["발견"]}<span style="font-size:18px" class="muted"> / 11 찾음</span></span>
        <div class="dots11">${A.map(a => `<i class="${a.tobe === "발견" ? "on" : ""}" title="${a.id}"></i>`).join("")}</div>
        <span class="muted" style="font-size:12.5px">잘못 짚은 것(오탐) ${D.false_positives.length}건</span></div>
    </div>
    <div class="tbl"><table><thead><tr><th>숨겨둔 문제</th><th class="r">금액(원)</th><th>지금 방식</th><th>K-Tieout</th><th>왜 차이가 났나</th></tr></thead><tbody>
      ${A.map(a => `<tr><td><span class="mono muted">${a.id}</span> ${ANOM_PLAIN[a.id]}</td><td class="r">${won(a.amount)}</td>
        <td><span class="pill ${RES[a.asis][0]}">${RES[a.asis][1]}</span></td><td><span class="pill ${RES[a.tobe][0]}">${RES[a.tobe][1]}</span></td>
        <td class="muted" style="font-size:12.5px">${esc(a.asis_why)}${a.mus_prob != null ? ` (표본에 뽑힐 확률 ${(a.mus_prob*100).toFixed(1)}%)` : ""}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="grid2">
      <div class="card"><div class="card-head"><h2>얼마나 확인했나</h2></div>
        <div class="hbar">
          <div class="r"><span>지금 · 건수</span><div class="t"><span style="width:${100*AC.vouch_n/C.pop_n}%;background:var(--muted)"></span></div><b class="num">${pct(AC.vouch_n, C.pop_n, 1)}</b></div>
          <div class="r"><span>K-Tieout</span><div class="t"><span style="width:100%;background:var(--brand)"></span></div><b class="num">100%</b></div>
          <div class="r"><span>지금 · 금액</span><div class="t"><span style="width:${100*AC.vouch_amt/C.pop_amt}%;background:var(--muted)"></span></div><b class="num">${pct(AC.vouch_amt, C.pop_amt, 1)}</b></div>
          <div class="r"><span>K-Tieout</span><div class="t"><span style="width:100%;background:var(--brand)"></span></div><b class="num">100%</b></div>
        </div>
        <p class="muted" style="font-size:12.5px;margin:12px 0 0">25건 표본은 감사기준이 허용하는 정상 방법입니다. 다만 나머지 ${C.pop_n - AC.vouch_n}건은 아무도 보지 않습니다.</p></div>
      <div class="card"><div class="card-head"><h2>부가세 신고와 장부 차이 ${won(vtot)}원의 정체</h2></div>
        <p class="muted" style="font-size:12.5px;margin:0 0 10px">지금 방식은 차이 금액만 보고 회사에 이유를 묻고 기다립니다. K-Tieout은 거래 ${items.length}건으로 나눠 보여줍니다. 설명 안 된 금액 ${won(vtot - items.reduce((s, x) => s + x.v, 0))}원.</p>
        <div class="vat">${items.map(x => `<div class="r"><span>${short(x.label.split(" · ")[0])} · ${esc(x.label.split(" · ")[1])}</span><div class="tr"><span class="ax" style="left:${zero}%"></span><span class="sg" style="left:${x.v >= 0 ? zero : zero - sc(x.v)}%;width:${sc(x.v)}%;background:${x.v >= 0 ? "var(--brand)" : "var(--muted)"}"></span></div><span class="mono" style="text-align:right">${x.v > 0 ? "+" : ""}${won(x.v)}</span></div>`).join("")}</div></div>
    </div>
    <div class="card"><div class="card-head"><h2>이 결과를 믿을 때 주의할 점</h2></div>
      <ul style="margin:0;padding-left:18px;display:grid;gap:4px;font-size:13.5px">
        <li>문제 거래도, 그걸 찾는 프로그램도 제가 같은 가짜 데이터로 만들었습니다. 실제 회사 자료에서는 결과가 이만큼 깔끔하지 않습니다.</li>
        <li>지금 방식은 단순화했습니다. 숙련된 회계사는 다른 절차로 일부를 더 찾을 수 있습니다.</li>
        <li>시간이 얼마나 줄어드는지는 아직 모릅니다. 실제 회계사와 같은 일을 두 방식으로 해 보고 재야 합니다.</li>
        <li>K-Tieout은 판단하지 않습니다. 이상한 거래를 골라줄 뿐이고 결론은 회계사가 냅니다.</li>
      </ul></div>`;
}

// ------------------------------------------------------------ 시작
const h = (location.hash || "").slice(1);
if (VIEWS.some(([k]) => k === h)) state.view = h;
render();
</script>
